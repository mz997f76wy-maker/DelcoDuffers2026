<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">

<title>Hackers vs Shankers Cup</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
margin:0;
background:#f3f4f6;
color:#111827;
}

header{
background:#111827;
color:white;
text-align:center;
padding:18px 12px;
}

header h1{
margin:0 0 5px;
font-size:30px;
}

main{
max-width:1050px;
margin:auto;
padding:12px;
}

.nav{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:12px;
}

button{
border:0;
border-radius:10px;
padding:11px 14px;
font-weight:800;
cursor:pointer;
font-size:15px;
}

.primary{
background:#111827;
color:white;
}

.good{
background:#d1fae5;
color:#065f46;
}

.danger{
background:#fee2e2;
color:#991b1b;
}

.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 2px 10px #00000010;
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:center;
}

.field{
flex:1;
min-width:130px;
}

label{
display:block;
font-size:12px;
font-weight:bold;
color:#6b7280;
margin-bottom:4px;
}

input,
select{
width:100%;
padding:11px;
border:1px solid #d1d5db;
border-radius:9px;
font-size:16px;
background:white;
}

.match{
border:1px solid #e5e7eb;
border-radius:14px;
padding:14px;
margin:12px 0;
}

.match h3{
margin-top:0;
}

.players{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.pill{
display:inline-block;
background:#f3f4f6;
padding:5px 8px;
border-radius:99px;
font-size:12px;
margin:2px;
}

.resultBanner{
margin-top:12px;
padding:12px;
border-radius:10px;
font-size:18px;
font-weight:900;
text-align:center;
}

.resultHackers{
background:#dbeafe;
color:#1d4ed8;
}

.resultShankers{
background:#fee2e2;
color:#b91c1c;
}

.resultHalved{
background:#e5e7eb;
color:#374151;
}

.scoreboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.team{
color:white;
border-radius:14px;
padding:16px;
}

.hackers{
background:#2563eb;
}

.shankers{
background:#dc2626;
}

.big{
font-size:38px;
font-weight:900;
}

.muted{
color:#6b7280;
}

.tablewrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th,
td{
padding:8px;
border-bottom:1px solid #e5e7eb;
}

.scoretable{
min-width:850px;
}

.scoretable th,
.scoretable td{
text-align:center;
border:1px solid #e5e7eb;
padding:5px;
}

.scoretable th:first-child,
.scoretable td:first-child{
position:sticky;
left:0;
background:white;
z-index:2;
}

.scoretable input{
width:55px;
text-align:center;
padding:8px;
}

.notice{
background:#fffbeb;
color:#92400e;
border:1px solid #fde68a;
padding:11px;
border-radius:9px;
}

.roundnav{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
}

.roundbuttons{
display:flex;
gap:6px;
}

@media(max-width:650px){

.players{
grid-template-columns:1fr;
}

header h1{
font-size:27px;
}

.big{
font-size:32px;
}

}

</style>

</head>

<body>

<header>

<h1>🏆 Hackers vs Shankers Cup</h1>

<div>
32 Players • 40 Ryder Cup Points • First to 20.5
</div>

</header>

<main>

<div
class="nav"
id="nav">
</div>

<div
id="app">
</div>

</main>

<script>

const STORAGE_KEY=
"delcoDuffers2026";


const ROUNDS=[

{
id:1,
course:"Tobacco Road",
format:"2v2 Best Ball",
matches:8,
type:"bestball",
skins:true
},

{
id:2,
course:"Mid South",
format:"2v2 Best Ball",
matches:8,
type:"bestball",
skins:true
},

{
id:3,
course:"Talamore",
format:"2-Man Scramble",
matches:8,
type:"scramble",
skins:false
},

{
id:4,
course:"Legacy",
format:"1v1 Match Play",
matches:16,
type:"singles",
skins:true
}

];


let data;


try{

data=
JSON.parse(
localStorage.getItem(STORAGE_KEY)
||
'{"players":[]}'
);

}

catch{

data={
players:[]
};

}


data.players ||= [];

data.matchups ||= {};

data.scores ||= {};

data.results ||= {};


let page=
"dashboard";


let currentRound=
1;



function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}



function saveAndRender(){

saveData();

render();

}



function getPlayer(id){

return data.players.find(

p=>
String(p.id)===
String(id)

);

}



function roundInfo(){

return ROUNDS[
currentRound-1
];

}



function nav(){

const tabs=[

[
"dashboard",
"Dashboard"
],

[
"players",
"Players"
],

[
"matchups",
"Matchups"
],

[
"scoring",
"Scoring"
]

];


document.getElementById(
"nav"
).innerHTML=

tabs.map(
tab=>`

<button

class="${
page===tab[0]
?
"primary"
:
""
}"

onclick="
page='${tab[0]}';
render();
">

${tab[1]}

</button>

`
).join("");

}



function teamPoints(){

let hackers=
0;

let shankers=
0;

let completed=
0;


Object.values(
data.results
)
.forEach(
result=>{

if(!result){
return;
}


if(
result.winner===
"Hackers"
){

hackers+=1;

completed+=1;

}


else if(
result.winner===
"Shankers"
){

shankers+=1;

completed+=1;

}


else if(
result.winner===
"Halved"
){

hackers+=0.5;

shankers+=0.5;

completed+=1;

}

}
);


return{

hackers,

shankers,

completed

};

}



function dashboard(){

const points=
teamPoints();


const hackers=

data.players.filter(
p=>
p.team===
"Hackers"
).length;


const shankers=

data.players.filter(
p=>
p.team===
"Shankers"
).length;


const groupA=

data.players.filter(
p=>
p.group===
"A"
).length;


const groupB=

data.players.filter(
p=>
p.group===
"B"
).length;


return`

<div class="card">

<h2>
Ryder Cup Score
</h2>


<div class="scoreboard">


<div class="team hackers">

<b>
HACKERS
</b>

<div class="big">

${points.hackers}

</div>

</div>


<div class="team shankers">

<b>
SHANKERS
</b>

<div class="big">

${points.shankers}

</div>

</div>


</div>


<p>

<b>
${40-points.completed}
</b>

matches remaining

</p>


</div>


<div class="card">

<h2>
Roster
</h2>


<p>

Hackers:
<b>
${hackers}/16
</b>

<br>

Shankers:
<b>
${shankers}/16
</b>

</p>


<p>

Group A:
<b>
${groupA}/16
</b>

<br>

Group B:
<b>
${groupB}/16
</b>

</p>


<p class="muted">

A/B groups are used for skins only.

They do not restrict Ryder Cup matchups.

</p>

</div>


<div class="card">

<h2>
Tournament Schedule
</h2>


${ROUNDS.map(
round=>`

<div class="match">

<b>

Round ${round.id}

—

${round.course}

</b>


<br>


<span class="muted">

${round.format}

•

${round.matches} points

•

${
round.skins
?
"Skins"
:
"No Skins"
}

</span>

</div>

`
).join("")}


</div>

`;

}



function playersPage(){

return`

<div class="card">

<h2>
Add Player
</h2>


<div class="row">


<div class="field">

<label>
Player Name
</label>

<input
id="name"
placeholder="Player name">

</div>


<div class="field">

<label>
Handicap
</label>

<input
id="hcp"
type="number"
step=".1">

</div>


<div class="field">

<label>
Team
</label>

<select id="team">

<option>
Hackers
</option>

<option>
Shankers
</option>

</select>

</div>


<div class="field">

<label>
Skins Group
</label>

<select id="group">

<option value="A">
Group A
</option>

<option value="B">
Group B
</option>

</select>

</div>


</div>


<button
class="primary"
onclick="
addPlayer()
">

Add Player

</button>


</div>


<div class="card">

<h2>

Roster

(${data.players.length}/32)

</h2>


<div class="tablewrap">

<table>


<tr>

<th>
Name
</th>

<th>
Team
</th>

<th>
Skins
</th>

<th>
HCP
</th>

<th>
</th>

</tr>


${data.players.map(
player=>`

<tr>

<td>

<b>
${player.name}
</b>

</td>


<td>

${player.team}

</td>


<td>

Group ${player.group}

</td>


<td>

${player.handicap}

</td>


<td>

<button
class="danger"

onclick="
deletePlayer(
'${player.id}'
)
">

Delete

</button>

</td>

</tr>

`
).join("")}


</table>

</div>

</div>

`;

}



function addPlayer(){

const name=

document
.getElementById("name")
.value
.trim();


const handicap=

document
.getElementById("hcp")
.value
||
0;


const team=

document
.getElementById("team")
.value;


const group=

document
.getElementById("group")
.value;


if(!name){

alert(
"Enter a player name."
);

return;

}


if(
data.players.length>=32
){

alert(
"Roster is full."
);

return;

}


if(

data.players.filter(
p=>
p.team===team
).length>=16

){

alert(
team+
" already has 16 players."
);

return;

}


if(

data.players.filter(
p=>
p.group===group
).length>=16

){

alert(
"Group "+
group+
" already has 16 players."
);

return;

}


data.players.push({

id:
"p"+
Date.now()+
Math.random(),

name,

handicap,

team,

group

});


saveAndRender();

}



function deletePlayer(id){

if(
!confirm(
"Delete this player?"
)
){

return;

}


data.players=

data.players.filter(

player=>

String(player.id)!==
String(id)

);


saveAndRender();

}



function setupMatches(){

const round=
roundInfo();


if(
!data.matchups[currentRound]
){

data.matchups[currentRound]=[];

}


while(

data.matchups[currentRound].length
<
round.matches

){

const index=

data.matchups[currentRound]
.length;


data.matchups[currentRound]
.push({

id:
"R"+
currentRound+
"M"+
(index+1),

hackers:[],

shankers:[]

});

}


return data.matchups[
currentRound
];

}



function playerOptions(
team,
currentPlayer
){

return`

<option value="">

Select Player

</option>


${data.players

.filter(
player=>
player.team===
team
)

.map(
player=>`

<option

value="${player.id}"

${
String(player.id)===
String(currentPlayer)

?
"selected"
:
""
}

>

${player.name}

—

HCP ${player.handicap}

—

Group ${player.group}

</option>

`
).join("")}

`;

}



function matchupPage(){

const round=
roundInfo();


const matches=
setupMatches();


return`

<div class="card">


<div class="roundnav">


<div>

<h2>

Round ${round.id}

—

${round.course}

</h2>


<div class="muted">

${round.format}

</div>

</div>


<div class="roundbuttons">


<button

onclick="
currentRound=
Math.max(
1,
currentRound-1
);

render();
">

←

</button>


<button

onclick="
currentRound=
Math.min(
4,
currentRound+1
);

render();
">

→

</button>


</div>


</div>


<div class="notice">

A/B groups do not restrict Ryder Cup matchups.

Any Hacker can play any Shanker.

</div>


${matches.map(

(match,index)=>

matchupCard(
round,
match,
index
)

).join("")}


<button
class="primary"

onclick="
validateRound()
">

Validate Matchups

</button>


</div>

`;

}



function matchupCard(
round,
match,
index
){

const numberNeeded=

round.type===
"singles"

?
1
:
2;


while(
match.hackers.length
<
numberNeeded
){

match.hackers.push("");

}


while(
match.shankers.length
<
numberNeeded
){

match.shankers.push("");

}


let hackerBoxes=
"";


let shankerBoxes=
"";


for(
let slot=0;
slot<numberNeeded;
slot++
){

hackerBoxes+=`

<select

onchange="
setMatchPlayer(
${index},
'hackers',
${slot},
this.value
)
">

${playerOptions(
"Hackers",
match.hackers[slot]
)}

</select>

`;


shankerBoxes+=`

<select

onchange="
setMatchPlayer(
${index},
'shankers',
${slot},
this.value
)
">

${playerOptions(
"Shankers",
match.shankers[slot]
)}

</select>

`;

}


const selectedPlayers=[

...match.hackers,

...match.shankers

]

.map(
getPlayer
)

.filter(
Boolean
);


return`

<div class="match">


<h3>

Match ${index+1}

</h3>


<div class="players">


<div>

<h3>
Hackers
</h3>

${hackerBoxes}

</div>


<div>

<h3>
Shankers
</h3>

${shankerBoxes}

</div>


</div>


<div>

${selectedPlayers.map(
player=>`

<span class="pill">

${player.name}

•

HCP ${player.handicap}

•

Group ${player.group}

</span>

`
).join("")}

</div>


</div>

`;

}



function setMatchPlayer(
matchIndex,
side,
slot,
playerId
){

data
.matchups[currentRound]
[matchIndex]
[side]
[slot]
=
playerId;


saveData();


render();

}



function validateRound(){

const round=
roundInfo();


const matches=
setupMatches();


const used=
new Set();


for(
let index=0;
index<matches.length;
index++
){

const match=
matches[index];


const required=

round.type===
"singles"

?
1
:
2;


if(

match.hackers.filter(
Boolean
).length
!==required

||

match.shankers.filter(
Boolean
).length
!==required

){

alert(

"Match "+
(index+1)+
" is incomplete."

);

return;

}


for(

const playerId of [

...match.hackers,

...match.shankers

]

){

if(
used.has(
String(playerId)
)
){

alert(
"A player is used more than once in this round."
);

return;

}


used.add(
String(playerId)
);

}

}


if(
used.size!==32
){

alert(
"All 32 players must appear exactly once."
);

return;

}


saveData();


alert(
"Round "+
currentRound+
" matchups are ready!"
);

}



function getScore(
matchId
){

if(
!data.scores[matchId]
){

data.scores[matchId]={

holes:
Array.from(
{length:18},
()=>({})
)

};

}


if(
!data.scores[matchId].holes
){

data.scores[matchId].holes=

Array.from(
{length:18},
()=>({})
);

}


while(
data.scores[matchId]
.holes.length
<
18
){

data.scores[matchId]
.holes.push(
{}
);

}


return data.scores[
matchId
];

}



function scoringPage(){

const round=
roundInfo();


const matches=
setupMatches();


return`

<div class="card">


<div class="roundnav">


<div>

<h2>

Round ${round.id}

Scoring

</h2>


<div class="muted">

${round.course}

•

${round.format}

</div>


</div>


<div class="roundbuttons">


<button

onclick="
currentRound=
Math.max(
1,
currentRound-1
);

render();
">

←

</button>


<button

onclick="
currentRound=
Math.min(
4,
currentRound+1
);

render();
">

→

</button>


</div>


</div>


${
round.type===
"scramble"

?

`

<div class="notice">

Round 3 is a two-man scramble.

Enter one team score for Hackers and one team score for Shankers on each hole.

There are no skins in Round 3.

</div>

`

:

`

<div class="notice">

Enter each player's gross score for all 18 holes.

Scores save immediately and stay visible.

</div>

`

}


${matches.map(

(match,index)=>

scoreCard(
round,
match,
index
)

).join("")}


</div>

`;

}



function scoreCard(
round,
match,
index
){

const score=
getScore(
match.id
);


const players=[

...match.hackers,

...match.shankers

]

.map(
getPlayer
)

.filter(
Boolean
);


const requiredPlayers=

round.type===
"singles"

?
2
:
4;


if(
players.length
<
requiredPlayers
){

return`

<div class="match">

<h3>

Match ${index+1}

</h3>


<div class="notice">

Set this matchup first.

</div>

</div>

`;

}


let header=
"";


let rows=
"";


if(
round.type===
"scramble"
){

header=`

<tr>

<th>
Hole
</th>

<th>
Hackers Team
</th>

<th>
Shankers Team
</th>

</tr>

`;


for(
let hole=0;
hole<18;
hole++
){

const scores=

score.holes[hole]
||
{};


rows+=`

<tr>


<td>

${hole+1}

</td>


<td>

<input

type="number"

min="1"

max="20"

value="${scores.H ?? ""}"

oninput="
enterScore(
'${match.id}',
${hole},
'H',
this.value
)
">

</td>


<td>

<input

type="number"

min="1"

max="20"

value="${scores.S ?? ""}"

oninput="
enterScore(
'${match.id}',
${hole},
'S',
this.value
)
">

</td>


</tr>

`;

}

}


else{

header=`

<tr>

<th>

Hole

</th>


${players.map(
player=>`

<th>

${player.name}

<br>

<span class="muted">

HCP ${player.handicap}

<br>

Group ${player.group}

</span>

</th>

`
).join("")}


</tr>

`;


for(
let hole=0;
hole<18;
hole++
){

const scores=

score.holes[hole]
||
{};


rows+=`

<tr>


<td>

${hole+1}

</td>


${players.map(
player=>`

<td>

<input

type="number"

min="1"

max="20"

value="${scores[player.id] ?? ""}"

oninput="
enterScore(
'${match.id}',
${hole},
'${player.id}',
this.value
)
">

</td>

`
).join("")}


</tr>

`;

}

}



const savedResult=

data.results[
match.id
]

?
data.results[
match.id
].winner

:
"";


let resultBanner=
"";


if(
savedResult===
"Hackers"
){

resultBanner=`

<div
class="
resultBanner
resultHackers
">

HACKERS WIN

—

1 POINT

</div>

`;

}


else if(
savedResult===
"Shankers"
){

resultBanner=`

<div
class="
resultBanner
resultShankers
">

SHANKERS WIN

—

1 POINT

</div>

`;

}


else if(
savedResult===
"Halved"
){

resultBanner=`

<div
class="
resultBanner
resultHalved
">

MATCH HALVED

—

½ POINT EACH

</div>

`;

}



return`

<div class="match">


<h3>

Match ${index+1}

<span class="pill">

${matchStatus(
round,
match,
score
)}

</span>

</h3>


<div>

${players.map(
player=>`

<span class="pill">

${player.name}

•

HCP ${player.handicap}

•

Group ${player.group}

</span>

`
).join("")}

</div>


<div class="tablewrap">


<table class="scoretable">

${header}

${rows}

</table>


</div>


<div
style="
margin-top:15px;
"
>

<label>

Official Match Result

</label>


<select

id="
result-${match.id}
">

<option value="">

Select Result

</option>


<option

value="Hackers"

${
savedResult===
"Hackers"

?
"selected"

:
""
}

>

Hackers

</option>


<option

value="Shankers"

${
savedResult===
"Shankers"

?
"selected"

:
""
}

>

Shankers

</option>


<option

value="Halved"

${
savedResult===
"Halved"

?
"selected"

:
""
}

>

Halved

</option>


</select>


</div>


<button

class="good"

style="
margin-top:10px;
"

onclick="
saveMatchResult(
'${match.id}'
)
">

Save Match Result

</button>


${resultBanner}


</div>

`;

}



function enterScore(
matchId,
hole,
playerId,
value
){

const score=
getScore(
matchId
);


score
.holes[hole]
[playerId]
=

value===""

?
""

:
Number(value);


saveData();

}



function holeWinner(
round,
match,
scores
){


if(
round.type===
"bestball"
){

const hackerScores=

match.hackers

.map(
id=>
Number(
scores[id]
)
)

.filter(
score=>
score>0
);


const shankerScores=

match.shankers

.map(
id=>
Number(
scores[id]
)
)

.filter(
score=>
score>0
);


if(

hackerScores.length<2

||

shankerScores.length<2

){

return null;

}


const hackerLow=

Math.min(
...hackerScores
);


const shankerLow=

Math.min(
...shankerScores
);


if(
hackerLow<
shankerLow
){

return "Hackers";

}


if(
shankerLow<
hackerLow
){

return "Shankers";

}


return "Tie";

}



if(
round.type===
"singles"
){

const hackerScore=

Number(
scores[
match.hackers[0]
]
);


const shankerScore=

Number(
scores[
match.shankers[0]
]
);


if(
!hackerScore
||
!shankerScore
){

return null;

}


if(
hackerScore<
shankerScore
){

return "Hackers";

}


if(
shankerScore<
hackerScore
){

return "Shankers";

}


return "Tie";

}



const hackerTeamScore=

Number(
scores.H
);


const shankerTeamScore=

Number(
scores.S
);


if(
!hackerTeamScore
||
!shankerTeamScore
){

return null;

}


if(
hackerTeamScore<
shankerTeamScore
){

return "Hackers";

}


if(
shankerTeamScore<
hackerTeamScore
){

return "Shankers";

}


return "Tie";

}



function matchStatus(
round,
match,
score
){

let hackers=
0;


let shankers=
0;


let played=
0;


score.holes.forEach(
scores=>{

const winner=

holeWinner(
round,
match,
scores
);


if(
!winner
){

return;

}


played++;


if(
winner===
"Hackers"
){

hackers++;

}


else if(
winner===
"Shankers"
){

shankers++;

}

}
);


if(
played===0
){

return "Not Started";

}


const difference=

hackers-
shankers;


if(
played===18
){

if(
difference===0
){

return "All Square after 18";

}


if(
difference>0
){

return "Hackers ahead after 18";

}


return "Shankers ahead after 18";

}


if(
difference===0
){

return "AS through "+played;

}


return(

Math.abs(
difference
)

+

" UP "

+

(
difference>0
?
"Hackers"
:
"Shankers"
)

+

" through "

+

played

);

}



function saveMatchResult(
matchId
){

const resultBox=

document.getElementById(
"result-"+matchId
);


if(
!resultBox
){

alert(
"Could not find the match result selector."
);

return;

}


const winner=

resultBox.value;


if(
!winner
){

alert(
"Pick Hackers, Shankers, or Halved."
);

return;

}


data.results[
matchId
]
={

winner

};


saveData();


render();


alert(
"Match result saved: "+
winner
);

}



function render(){

nav();


document
.getElementById(
"app"
)
.innerHTML=

page===
"dashboard"

?
dashboard()

:

page===
"players"

?
playersPage()

:

page===
"matchups"

?
matchupPage()

:

scoringPage();

}



render();

</script>
