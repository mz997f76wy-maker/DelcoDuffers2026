<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Delco Duffers 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;text-align:center;padding:12px 12px 16px}
header h1{margin:0 0 5px;font-size:28px}
.logoBox{width:280px;height:90px;margin:0 auto 8px;overflow:hidden;border-radius:10px;background:white;display:flex;align-items:center;justify-content:center}
.logo{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.25)}
.headerMeta{font-size:18px}
.captains{font-size:14px;margin-top:5px;opacity:.9}
main{max-width:1100px;margin:auto;padding:12px}
.navWrap{position:relative;margin-bottom:12px}
.nav{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 46px 4px 0;margin-bottom:0}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:0 0 auto}
.navScrollCue{display:none}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;font-size:15px;cursor:pointer}
.primary{background:#111827;color:white}
.good{background:#d1fae5;color:#065f46}
.danger{background:#fee2e2;color:#991b1b}
.blue{background:#dbeafe;color:#1d4ed8}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #00000010}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{flex:1;min-width:130px}
label{display:block;font-size:12px;font-weight:bold;color:#6b7280;margin-bottom:4px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;background:white}
input:disabled,select:disabled{background:#f3f4f6;color:#374151;opacity:1}
.match{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:12px 0}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pill{display:inline-block;background:#f3f4f6;padding:5px 8px;border-radius:99px;font-size:12px;margin:2px}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{color:white;border-radius:14px;padding:16px}
.hackers{background:#dc2626}
.shankers{background:#2563eb}
.big{font-size:38px;font-weight:900}
.muted{color:#6b7280}
.scheduleDetails{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 0}
.scheduleDetail{background:#f9fafb;border-radius:10px;padding:11px 12px;min-width:0}
.scheduleDetails dt{color:#6b7280;font-size:12px;font-weight:800;margin:0 0 5px}
.scheduleDetails dd{font-size:16px;font-weight:700;line-height:1.4;margin:0;overflow-wrap:anywhere}
.scheduleNote{font-size:13px;color:#6b7280;margin:9px 0 0}
@media(max-width:600px){.scheduleDetails{grid-template-columns:1fr}.scheduleDetail{padding:10px 12px}}
.notice{background:#fffbeb;color:#92400e;border:1px solid #fde68a;padding:11px;border-radius:9px;margin:10px 0}
.viewer{background:#eff6ff;color:#1e40af;border:1px solid #93c5fd;padding:10px;border-radius:9px;margin-bottom:12px}
.admin{background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7;padding:10px;border-radius:9px;margin-bottom:12px}
.captainMode{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;padding:10px;border-radius:9px;margin-bottom:12px}
.scorerMode{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd;padding:10px;border-radius:9px;margin-bottom:12px}
.offline{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;padding:10px;border-radius:9px;margin-bottom:12px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #e5e7eb}
.scoretable{min-width:1280px}
.scorePlayerDetails{display:none}

.scoretable th,.scoretable td{text-align:center;border:1px solid #d1d5db;padding:5px;white-space:nowrap}
.scoretable th:first-child,.scoretable td:first-child{position:sticky;left:0;background:white;z-index:3;min-width:155px;text-align:left}
.scoretable input{width:46px;text-align:center;padding:8px 3px;border-radius:6px}
.scoretable input.scoreInput:focus{outline:3px solid #9ca3af;outline-offset:1px;border-color:#111827;background:white}
@media(max-width:650px){
.scoretable{width:max-content;min-width:0}
.scoretable th,.scoretable td{min-width:54px}
.scoretable th:first-child,.scoretable td:first-child{width:112px;min-width:112px;max-width:112px;white-space:normal;overflow-wrap:anywhere;font-size:13px;line-height:1.25}
.scoretable .scorePlayerMeta{display:none}
.scorePlayerDetails{display:block;font-size:12px;margin:8px 0;color:#4b5563}
.scorePlayerDetails summary{cursor:pointer;font-weight:700;padding:6px 0}
.scorePlayerDetails ul{padding-left:18px;line-height:1.6}
}
.coursePar td{font-weight:900;background:#7f1d1d;color:white}
.coursePar td:first-child{background:#7f1d1d}
.courseHcp td{font-weight:800;background:#f3f4f6}
.courseHcp td:first-child{background:#f3f4f6}
.hackerScoreRow td:first-child{background:#fee2e2;color:#991b1b;font-weight:900}
.shankerScoreRow td:first-child{background:#dbeafe;color:#1d4ed8;font-weight:900}
.summaryCell{font-weight:900;background:#f3f4f6}
.scoringAccessPanel{background:#f9fafb;border:1px solid #d1d5db;border-radius:12px;padding:14px;margin:14px 0}
.scoringAccessPanel h3{margin:0 0 8px}
.scoringAccessRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid #e5e7eb}
.scoringAccessRow:first-of-type{border-top:0}
.scoringAccessName{font-weight:900}
.scoringAccessActions{display:flex;align-items:center;gap:8px}
.scoringOpenBadge{display:inline-block;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;border-radius:99px;padding:6px 9px;font-size:12px;font-weight:900}
.scoringLockedBadge{display:inline-block;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;border-radius:99px;padding:6px 9px;font-size:12px;font-weight:900}
.scoringOpenNotice{background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7;padding:10px;border-radius:9px;margin:10px 0;font-weight:900}
.scoringLockedNotice{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;padding:10px;border-radius:9px;margin:10px 0;font-weight:900}
.resetArea{margin-top:16px;padding-top:16px;border-top:2px solid #e5e7eb}
.resetButton{width:100%;background:#991b1b;color:white;font-size:16px;padding:14px}
.resultOnly{max-width:650px;margin:14px auto}
.roundnav{display:flex;justify-content:space-between;gap:10px;align-items:center}
.roundbuttons{display:flex;gap:6px}
.resultBanner{margin-top:12px;padding:14px;border-radius:10px;font-size:20px;font-weight:900;text-align:center}
.resultHackers{background:#fee2e2;color:#b91c1c}
.resultShankers{background:#dbeafe;color:#1d4ed8}
.resultHalved{background:#e5e7eb;color:#374151}
.scatWinner{background:#ecfdf5;border:1px solid #6ee7b7;padding:10px;border-radius:9px;margin:6px 0}
.scatTie{background:#fff7ed;border:1px solid #fdba74;padding:10px;border-radius:9px;margin:6px 0}
.scatNone{background:#f9fafb;border:1px solid #e5e7eb;padding:10px;border-radius:9px;margin:6px 0;color:#6b7280}
.scatCount{font-size:22px;font-weight:900}
.allScatPlayer{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:10px 0}
.allScatPlayerName{font-size:19px;font-weight:900}
.allScatTotal{font-size:14px;font-weight:900;color:#065f46;margin-top:2px}
.allScatWin{padding:8px 0;border-top:1px solid #e5e7eb;margin-top:8px}
.allScatWin:first-of-type{margin-top:10px}
.par3Hero{background:#111827;color:white;border-radius:16px;padding:20px;margin-bottom:14px;text-align:center}
.par3Hero h2{margin:0 0 5px;font-size:28px}
.par3Hero p{margin:0;color:#d1d5db;font-size:14px}
.par3Round{background:white;border-radius:16px;overflow:hidden;margin-bottom:15px;box-shadow:0 2px 10px #00000010;border:1px solid #d1d5db}
.par3RoundHeader{background:#111827;color:white;padding:14px 16px}
.par3RoundHeader h2{margin:0;font-size:21px}
.par3RoundHeader div{font-size:13px;margin-top:3px;opacity:.8}
.par3Hole{display:grid;grid-template-columns:85px minmax(0,1fr);align-items:center;gap:12px;padding:14px 16px;border-bottom:2px solid #e5e7eb}
.par3Hole:last-child{border-bottom:0}
.par3HoleNumber{width:70px;height:54px;background:#f3f4f6;border:1px solid #d1d5db;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:1000}
.par3HoleNumber span:first-child{font-size:11px;color:#6b7280;text-transform:uppercase}
.par3HoleNumber span:last-child{font-size:22px}
.par3WinnerLabel{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:5px}
.par3WinnerName{font-size:18px;font-weight:900}
.par3WinnerPending{color:#9ca3af;font-weight:800}
.par3Select{font-weight:800}
.par3Distance{display:flex;align-items:center;gap:5px;margin-top:5px;height:30px;font-size:12px;color:#6b7280}
.par3Distance input{width:48px;min-width:0;height:30px;padding:3px 5px;text-align:center;border-radius:6px;font-size:16px}
.par3Distance input::-webkit-inner-spin-button{appearance:none}
.par3DistanceValue{font-size:13px;font-weight:800;color:#374151;margin-top:5px}
.par3Saved{font-size:12px;font-weight:900;color:#065f46;margin-top:5px}
.loginBox{max-width:500px;margin:auto}
.loading{text-align:center;padding:40px;font-size:18px;font-weight:bold}
.editBox{background:#f9fafb;border:1px solid #d1d5db;padding:14px;border-radius:12px;margin-bottom:15px}
.playerTeamHeader{color:white;padding:14px;border-radius:12px;margin-bottom:12px}
.playerTeamHeader h2{margin:0;color:white}
.playerTeamHeader.hackerHeader{background:#dc2626}
.playerTeamHeader.shankerHeader{background:#2563eb}
.playerGroupCard.hackerGroup{border-top:8px solid #dc2626}
.playerGroupCard.shankerGroup{border-top:8px solid #2563eb}
.foursomeCard{background:#f9fafb;border:2px solid #d1d5db;border-radius:14px;padding:14px;margin:16px 0}
.foursomeCard h2{margin:0 0 4px}
.innerMatch{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:10px 0}
.innerMatch h3{margin:0 0 10px}
.hackerLabel{font-weight:900;color:#dc2626;margin-bottom:6px}
.shankerLabel{font-weight:900;color:#2563eb;margin-bottom:6px}
.teamSelects select{margin-bottom:8px}
.teeSection{margin-top:14px;padding-top:13px;border-top:1px solid #e5e7eb}
.teeSectionTitle{font-size:13px;font-weight:900;margin-bottom:8px}
.teeList{font-size:11px;line-height:1.5;color:#6b7280;white-space:nowrap}
.matchupSelectRow{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.matchupSelectRow select{flex:1;min-width:0;margin-bottom:0}
.matchupHcp{font-size:11px;font-weight:700;color:#6b7280;white-space:nowrap}
.matchupPlayer{font-weight:800}
.matchupPlayer .matchupHcp{margin-left:4px}
.liveCard{padding:0;overflow:hidden}
.liveRoundControl{padding:14px 16px;background:white}
.liveRoundControl label{font-size:13px}
.liveRoundControl select{font-weight:800}
.leadersControls{margin-bottom:14px}
.leadersRounds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.leadersRounds button{min-height:54px;padding:9px 4px;font-size:13px;border:2px solid #d1d5db;background:#f3f4f6;color:#374151}
.leadersRounds button[aria-pressed="true"]{background:#111827;border-color:#111827;color:white}
.leadersRounds button span{display:block;font-size:11px;margin-bottom:4px}
.leadersNote{font-size:12px;color:#4b5563;line-height:1.5;margin:10px 0 0}
/* Masters-style leaderboard: ordinary 1px rules, section dividers 5px. */
.augustaBoard{--board-green:#07513d;background:#fff;color:#111;border:5px solid var(--board-green);margin-bottom:20px;overflow:hidden}
.augustaHeading{background:#fff;color:var(--board-green);text-align:center;padding:12px 8px;border-bottom:3px solid var(--board-green)}
.augustaHeading h2{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:36px;font-weight:800;letter-spacing:1px;margin:0;line-height:1}
.augustaHeading p{font-size:11px;margin:6px 0 0;letter-spacing:1px}
.augustaTable{border-collapse:separate;border-spacing:0;width:100%;min-width:1000px;background:#fff;color:#111;table-layout:fixed}
.augustaTable th,.augustaTable td{border:0;border-right:1px solid var(--board-green);border-bottom:1px solid var(--board-green);padding:3px 2px;text-align:center;height:34px;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15;background:#fff}
.augustaTable thead th{color:var(--board-green);font-size:20px;height:30px}
.augustaTable .augustaPrior{width:52px;position:sticky;left:0;z-index:2;background:#fff;border-right:5px solid var(--board-green)}
.augustaTable thead .augustaPrior{font-size:17px;z-index:4}
.augustaTable .augustaName{width:165px;text-align:left;padding-left:8px;position:sticky;left:52px;z-index:2;background:#fff;text-transform:uppercase;font-size:21px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;border-right:5px solid var(--board-green)}
.augustaTable thead .augustaName{z-index:4;text-align:center}
.augustaTable .augustaBackNine{border-left:4px solid var(--board-green)}
.augustaTable .augustaFinish{width:65px;border-left:4px solid var(--board-green);border-right:0;font-weight:800}
.augustaTable tbody tr:nth-child(3n+1)>*{border-bottom:5px solid var(--board-green)}
.augustaTable tbody tr:last-child>*{border-bottom:0}
.augustaTable .augustaUnder{color:#bd2026}
.augustaTable .augustaOver,.augustaTable .augustaEven{color:#111}
.augustaLegend{color:var(--board-green);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px;padding:10px 8px;border-top:3px solid var(--board-green);line-height:1.5}
.augustaEmpty{padding:25px 12px;background:#fff;color:#111;text-align:center;font-size:14px}
.leadersRounds button{border-color:#07513d;background:#fff;color:#07513d;border-radius:3px}
.leadersRounds button[aria-pressed="true"]{background:#07513d;border-color:#07513d;color:#fff}
.leadersRounds button:focus-visible{outline:3px solid #07513d;outline-offset:3px}
@media(max-width:480px){.augustaHeading h2{font-size:30px}}
.dashboardRoundLabel{font-size:13px;font-weight:800;color:#6b7280;margin-bottom:8px}
.dashboardRounds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dashboardRoundButton{min-width:0;min-height:56px;padding:10px 4px;background:#f3f4f6;color:#374151;border:2px solid #d1d5db;font-size:13px;line-height:1.25}
.dashboardRoundButton span{display:block}
.dashboardRoundNumber{font-size:10px;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.dashboardRoundButton[aria-pressed="true"]{background:#111827;color:white;border-color:#111827}
.dashboardRoundButton:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.liveBoard{background:#e5e7eb;padding:14px}
.liveTitle{background:#e5e7eb;color:#111827;font-size:28px;font-weight:1000;letter-spacing:1px;padding:15px 18px;margin-bottom:14px;text-transform:uppercase;border:1px solid #d1d5db}
.liveSubtitle{font-size:13px;font-weight:800;margin-top:4px}
.liveScoreHeader{display:grid;grid-template-columns:1fr 72px 72px 1fr;gap:6px;margin-bottom:12px}
.liveTeamName{font-size:22px;font-weight:1000;padding:13px;color:white;display:flex;align-items:center}
.liveTeamName.h{background:#dc2626}
.liveTeamName.s{background:#2563eb;justify-content:flex-end;text-align:right}
.livePoints{background:#e5e7eb;border:1px solid #d1d5db;font-size:27px;font-weight:1000;display:flex;align-items:center;justify-content:center;color:#111827}
.liveRows{background:white}
.liveMatchRow{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);min-height:66px;border-bottom:4px solid #d1d5db}
.liveMatchRow:last-child{border-bottom:0}
.liveSide{display:flex;align-items:center;padding:8px 14px;font-size:20px;font-weight:900;line-height:1.15}
.liveSide.left{justify-content:flex-end;text-align:right}
.liveSide.right{justify-content:flex-start;text-align:left}
.liveCenter{display:flex;align-items:center;justify-content:center;background:#e5e7eb;border-left:1px solid #d1d5db;border-right:1px solid #d1d5db;font-weight:1000;font-size:13px;text-align:center;color:#111827}
.liveCenter.liveLeaderHackers{background:#dc2626;color:white}
.liveCenter.liveLeaderShankers{background:#2563eb;color:white}
.liveCenter.liveTied{background:#f3f4f6;color:#374151}
.liveStatusMain{display:block;font-size:16px;line-height:1.2}
.liveStatusDetail{display:block;font-size:10px;line-height:1.3;margin-top:4px}
.liveWinHackers .liveSide.left{background:#dc2626;color:white}
.liveWinShankers .liveSide.right{background:#2563eb;color:white}
.liveHalved .liveSide{background:#f3f4f6}
.liveEmpty{color:#9ca3af;font-weight:700}
.livePlayerName{display:block}
.livePlayerHcp{display:block;font-size:.62em;font-weight:700;opacity:.72;white-space:nowrap;margin-left:0;margin-top:2px}
.liveFoursome{border:1px solid #9ca3af;border-radius:8px;margin:9px 5px;overflow:hidden;background:white}
.liveFoursome:first-child{margin-top:5px}
.liveFoursome:last-child{margin-bottom:5px}
.liveFoursome .liveMatchRow{border-bottom:1px solid #e5e7eb}
.liveFoursome .liveMatchRow:last-child{border-bottom:0}
.historyHero{background:#111827;color:white;border-radius:16px;padding:20px;margin-bottom:14px;text-align:center}
.historyHero h2{margin:0 0 6px;font-size:28px}
.historyHero p{margin:0;opacity:.8;font-size:14px}
.historyYear{background:white;border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 10px #00000010;border:1px solid #d1d5db}
.historyYearHeader{background:#111827;color:white;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.historyYearHeader h2{margin:0;font-size:28px}
.historyChampion{padding:18px;background:#eff6ff;border-bottom:1px solid #d1d5db}
.historyChampionTitle{font-size:12px;font-weight:900;color:#1d4ed8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.historyChampionTeam{font-size:23px;font-weight:1000;color:#111827}
.historyRoster{font-size:13px;line-height:1.55;color:#4b5563;margin-top:8px}
.historyGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.historySection{border:1px solid #e5e7eb;border-radius:12px;padding:14px;background:#fff}
.historySection h3{margin:0 0 10px;font-size:17px}
.historyResult{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
.historyResult:last-child{border-bottom:0}
.historyPlace{font-weight:900;min-width:22px}
.historyPlayer{flex:1;font-weight:800}
.historyScore{font-weight:900;white-space:nowrap}
.historyCtp{grid-column:1/-1}
.historyCtpList{display:flex;flex-wrap:wrap;gap:7px}
.historyCtpPlayer{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:99px;padding:7px 10px;font-size:13px;font-weight:800}
@media(max-width:650px){
.players{grid-template-columns:1fr}
.logoBox{width:240px;height:78px}
header h1{font-size:25px}
.headerMeta{font-size:16px}
.captains{font-size:13px}
.big{font-size:32px}
.navWrap{background:#fff;border:2px solid #d1d5db;border-radius:13px;padding:5px 5px 28px;box-shadow:0 2px 8px #00000012}
.nav{padding:1px 44px 2px 1px}
.navScrollCue{display:block;position:absolute;right:5px;bottom:4px;font-size:11px;font-weight:1000;letter-spacing:.5px;color:#1d4ed8;background:#dbeafe;padding:4px 8px;border-radius:99px;pointer-events:none;animation:cueMove 1.2s ease-in-out infinite alternate}
@keyframes cueMove{from{transform:translateX(-4px)}to{transform:translateX(2px)}}
.liveBoard{padding:7px}
.liveTitle{font-size:21px;padding:12px 10px;margin-bottom:8px}
.liveSubtitle{font-size:11px}
.liveScoreHeader{grid-template-columns:1fr 50px 50px 1fr;gap:3px;margin-bottom:7px}
.liveTeamName{font-size:15px;padding:9px 6px}
.livePoints{font-size:19px}
.liveMatchRow{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);min-height:57px;border-bottom:4px solid #d1d5db}
.liveSide{font-size:14px;padding:6px 5px}

function playerTee(player,roundId){
if(!player)return"";
const course=COURSE_HANDICAP_DATA[Number(roundId)];
if(!course)return"";
return player[course.teeField]||course.defaultTee;
}

function courseHandicap(player,roundId){
if(!player)return"";
const index=Number(player.handicap);
if(!Number.isFinite(index))return player.handicap??"";
const course=COURSE_HANDICAP_DATA[Number(roundId)];
if(!course)return player.handicap;
const teeName=playerTee(player,roundId);
const tee=course.tees[teeName]||course.tees[course.defaultTee];
return Math.round(index*(tee.slope/113)+(tee.rating-course.par));
}

function handicapDisplay(player,roundId){

}

async function refreshSessionIfNeeded(){
if(!session||!session.refresh_token)return;
const expiresAt=Number(session.expires_at||0);

if(expiresAt&&expiresAt-now>120)return;
try{
const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{
method:"POST",
headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
body:JSON.stringify({refresh_token:session.refresh_token})
});
if(!r.ok){if(r.status===400||r.status===401){storeSession(null);currentUser=null;userRole="viewer";userTeam=null;}throw new Error("Refresh failed");}
const x=await r.json();
x.expires_at=Math.floor(Date.now()/1000)+Number(x.expires_in||3600);
storeSession(x);
}catch{/* Keep the existing session on a temporary connection failure. */}
}

function drawPendingDetails(box,items){
if(!items.length)return;
const note=document.createElement("div");
note.style.marginTop="6px";
note.textContent=items.length+" change(s) saved on this phone — waiting to upload. Keep this browser's data; reopen the app with a connection to finish.";
box.appendChild(note);
const retry=document.createElement("button");retry.className="blue";retry.style.marginTop="6px";retry.textContent="Retry uploads";
retry.onclick=()=>{for(const item of pendingChanges())if(item.state==="blocked"){item.state="pending";putPending(item)}flushPendingChanges();};
box.appendChild(retry);
for(const item of items.filter(x=>x.state==="conflict"||x.state==="blocked")){
const line=document.createElement("div");line.style.marginTop="8px";
line.textContent=queueLabel(item)+" • On this phone: "+queueValue(item)+" • "+(item.state==="conflict"?"Changed online; upload paused.":"Upload needs attention: "+(item.message||"Check scoring access."));
if(item.state==="conflict"){
const online=document.createElement("div");online.textContent="Online: "+((item.current||[]).map(row=>queueValue({...item,row,remove:false})).join(", ")||"No entry");line.appendChild(online);
}
const discard=document.createElement("button");discard.className="danger";discard.textContent="Discard this phone's pending entry";
discard.onclick=()=>discardPendingGroup(item.id);line.appendChild(discard);box.appendChild(line);
}
}
async function discardPendingGroup(id){
const item=pendingChanges().find(x=>x.id===id);if(!item)return;
if(!confirm("Discard the pending changes for "+queueLabel(item)+" on this phone and use the online value? You can then enter a correction again."))return;
for(const x of pendingChanges())if(x.table===item.table&&rowKey(x.table,x.row)===rowKey(item.table,item.row))localStorage.removeItem(queueStorageKey(x));
await loadSharedData(false);render();
}
function queueDatabaseChange(table,row,remove=false){
if(!queueOwner())throw new Error("Sign in before saving scores.");
let rows=serverRows(table);
for(const item of pendingChanges().filter(x=>x.table===table&&x.state!=="conflict"))rows=applyQueuedRow(rows,item);
const key=rowKey(table,row);
const item={id:crypto.randomUUID(),owner:queueOwner(),table,row:cleanQueueRow(row),remove,
expected:rows.filter(r=>rowKey(table,r)===key).map(cleanQueueRow),created:Math.max(Date.now(),...pendingChanges().map(x=>x.created+1)),state:"pending"};
try{putPending(item);queueStorageError=""}catch(error){
queueStorageError="NOT saved on this phone: storage is unavailable or full. Keep this page open and record the score elsewhere.";
drawSaveSyncStatus();throw error;
}
drawSaveSyncStatus();flushPendingChanges();
return Promise.resolve({queued:true});
}
async function flushPendingChanges(){
if(queueFlushing||!queueOwner()||navigator.onLine===false)return;
queueFlushing=true;drawSaveSyncStatus();
try{
const work=async()=>{
const owner=queueOwner();
for(const item of pendingChanges()){
if(queueOwner()!==owner||document.hidden)break;
const earlier=pendingChanges().filter(x=>x.table===item.table&&rowKey(x.table,x.row)===rowKey(item.table,item.row)&&x.created<=item.created);
if(item.state!=="pending"||earlier.some(x=>x.state==="conflict"||x.state==="blocked"))continue;
try{
await refreshSessionIfNeeded();
if(queueOwner()!==owner||!session?.access_token)break;
const response=await fetch(SUPABASE_URL+"/rest/v1/rpc/save_duffers_queued_change",{
method:"POST",headers:headers(),signal:AbortSignal.timeout(12000),
body:JSON.stringify({p_table:item.table,p_row:item.row,p_expected:item.expected,p_delete:item.remove})
});
if(!response.ok){
if(response.status>=500||response.status===408||response.status===429)break;
item.state="blocked";item.message=response.status===401?"Sign in again to upload.":response.status===403?"Scoring access or an open round is required.":"Entry could not be accepted. Check the score.";
putPending(item);continue;
}
const result=await response.json();
if(queueOwner()!==owner)break;
if(result.status==="conflict"){item.state="conflict";item.current=result.current;putPending(item);continue}
if(result.status!=="saved")break;
localStorage.removeItem(queueStorageKey(item));lastConfirmedSave=Date.now();
// Update the confirmed baseline immediately; the next sync refreshes server fingerprints.
confirmedPhoneChanges.push({...item,confirmedAt:Date.now()});
cacheSharedData();
}catch(error){console.debug("Score kept on phone; upload will retry.");break}
}
};
if(navigator.locks?.request)await navigator.locks.request("duffers-score-upload",work);else await work();
}finally{queueFlushing=false;drawSaveSyncStatus()}
}
function overlayPendingRows(batches){
const copy=batches.map(rows=>rows.map(r=>({...r})));
for(const item of [...confirmedPhoneChanges,...pendingChanges()]){
if(item.state==="conflict")continue;
const index=sharedTables.indexOf(item.table);
if(index>=0)copy[index]=applyQueuedRow(copy[index],item);
}
return copy;
}
function cacheSharedData(){
try{localStorage.setItem("duffers-cache:"+sharedScope,JSON.stringify({batches:sharedBatches,hashes:sharedHashes,time:lastConfirmedSync,confirmed:confirmedPhoneChanges}))}catch{}
}
function restoreSharedCache(scope){
try{const cache=JSON.parse(localStorage.getItem("duffers-cache:"+scope)||"null");
if(cache?.batches&&cache?.hashes){sharedBatches=cache.batches;sharedHashes=cache.hashes;lastConfirmedSync=cache.time||null;confirmedPhoneChanges=cache.confirmed||[];}
}catch{}
}
window.addEventListener("online",()=>flushPendingChanges());
window.addEventListener("storage",event=>{if(event.key?.startsWith(QUEUE_PREFIX))drawSaveSyncStatus()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)flushPendingChanges()});
setInterval(()=>{if(!document.hidden)flushPendingChanges()},15000);

// Cache small stable batches; unchanged polls return no tournament rows.
const sharedTables=["tournament_players","tournament_matchups","tournament_scores","tournament_results","tournament_round_settings","tournament_par3_results","tournament_live_status","tournament_thursday_scores"];
let sharedBatches={},sharedHashes={},sharedScope=null;
let sharedSyncQueue=Promise.resolve();
function fetchSharedChanges(cacheOnly=false){
const task=sharedSyncQueue.then(async()=>{
if(!cacheOnly)await refreshSessionIfNeeded();
const scope=(currentUser?.id||"public")+":"+userRole;
if(scope!==sharedScope){
sharedBatches={};sharedHashes={};confirmedPhoneChanges=[];lastConfirmedSync=null;lastConfirmedSave=null;sharedScope=scope;restoreSharedCache(scope);
}
sharedFetchOnline=false;
const syncStartedAt=Date.now();
try{
if(cacheOnly||navigator.onLine===false)throw new Error("Using saved phone data");
const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/sync_duffers_changes",{
method:"POST",headers:headers(),
signal:AbortSignal.timeout(12000),
body:JSON.stringify({p_tournament_id:TOURNAMENT_ID,p_known:sharedHashes})
});
if(!r.ok)throw new Error("Tournament sync failed");
const response=await r.json();
if(!Array.isArray(response.patches))throw new Error("Invalid tournament sync");
// Validate the entire response before advancing any cached fingerprints.
for(const patch of response.patches){
if(!sharedTables.includes(patch.table)||!Number.isInteger(patch.bucket)||
patch.bucket<0||patch.bucket>31||patch.key!==patch.table+":"+patch.bucket||
typeof patch.hash!=="string"||!Array.isArray(patch.rows)){
throw new Error("Invalid tournament update");
}
}
for(const patch of response.patches){
sharedBatches[patch.key]=patch.rows;
sharedHashes[patch.key]=patch.hash;
}
confirmedPhoneChanges=confirmedPhoneChanges.filter(x=>x.confirmedAt>=syncStartedAt);
sharedFetchOnline=true;
}catch(error){if(!Object.keys(sharedBatches).length)throw error;}
return overlayPendingRows(sharedTables.map(table=>{
const rows=[];
for(let bucket=0;bucket<32;bucket++)rows.push(...(sharedBatches[table+":"+bucket]||[]));
return rows;
}));
});
sharedSyncQueue=task.catch(()=>{});
return task;
}

function teamPoints(){
let hackers=0,shankers=0,completed=0;
const results={...data.results};
for(const round of [1,2,4]){
for(const match of data.matchups[round]||[]){
if(match)results[match.id]={winner:effectiveMatchResult(round,match)};
}
}
Object.values(results).forEach(r=>{
if(!r)return;
if(r.winner==="Hackers"){hackers++;completed++}
else if(r.winner==="Shankers"){shankers++;completed++}
else if(r.winner==="Halved"){hackers+=.5;shankers+=.5;completed++}

return{hackers,shankers,completed};
}

function leaderboardPlayerRound(player,round){
const playerId=String(player.id);
const match=(data.matchups[round]||[]).find(m=>m&&[...(m.hackers||[]),...(m.shankers||[])].some(id=>String(id)===playerId));
const sources=Object.entries(data.scores).filter(([id])=>id.startsWith("R"+round+"M"));
// Prefer the current matchup; retain entered scores if a player was moved.
sources.sort(([a],[b])=>Number(b===match?.id)-Number(a===match?.id));
const card=COURSE_CARDS[round];
const hcp=Number(courseHandicap(player,round));
const handicapValid=Number.isFinite(hcp);
const holes=card.par.map((par,h)=>{
let gross=null;
for(const [,score] of sources){
const raw=score.holes?.[h]?.[playerId];
const value=Number(raw);
if(raw!==""&&raw!=null&&Number.isFinite(value)&&value>0){gross=value;break;}
}
// Round-specific playing handicap, allocated by hole difficulty, including plus handicaps.
const strokes=handicapValid?Math.floor(hcp/18)+(card.hcp[h]<=((hcp%18+18)%18)?1:0):null;
return{gross:gross===null?null:gross-par,net:gross===null||strokes===null?null:gross-par-strokes};
});
return{holes,match,handicapValid};
}

function leaderboardPlaceholderRows(round){
const info=ROUNDS.find(r=>r.id===round);
const raw=data.matchups[round]||[];
let matches=Array.from({length:info.matches},(_,i)=>raw[i]||{
matchNo:i+1,hackers:[],shankers:[],teeTime:"",teeStartHole:""
});
if(round===4){
matches=Array.from({length:8},(_,f)=>{
const pair=matches.filter(m=>m.matchNo===f*2+1||m.matchNo===f*2+2)
.sort((a,b)=>a.matchNo-b.matchNo);
return{foursomeNo:f+1,teeTime:pair.find(m=>m.teeTime)?.teeTime||"",pair};
}).sort((a,b)=>(a.teeTime||"99:99").localeCompare(b.teeTime||"99:99")||a.foursomeNo-b.foursomeNo)
.flatMap(f=>f.pair);
}else{
matches.sort((a,b)=>(a.teeTime||"99:99").localeCompare(b.teeTime||"99:99")||
((round===2||round===3)?Number(a.teeStartHole||99)-Number(b.teeStartHole||99):0)||
a.matchNo-b.matchNo);
}
const seen=new Set(),players=[];
for(const match of matches){
for(const id of [...(match.hackers||[]),...(match.shankers||[])]){
const player=getPlayer(id),key=String(id);
if(!player||seen.has(key))continue;
seen.add(key);players.push(player);
}
}
return players.slice(0,10).map(player=>({
player,start:null,total:null,strokes:null,cumulative:Array(18).fill(null),
played:0,eligible:false,hasScores:false
}));
}

function leaderboardRows(round,mode){
const priorRounds=LEADERBOARD_ROUNDS.filter(id=>id<round);
const ranked=data.players.map(player=>{
let start=0,priorComplete=true,hasScores=false,countedPar=0;
for(const prior of priorRounds){
countedPar+=COURSE_CARDS[prior].par.reduce((sum,par)=>sum+par,0);
const previous=leaderboardPlayerRound(player,prior);
for(const hole of previous.holes){
const value=hole[mode];
if(value===null)priorComplete=false;
else{start+=value;hasScores=true;}
}
}
const current=leaderboardPlayerRound(player,round);
let running=priorComplete?start:null,played=0;
const cumulative=Array(18).fill(null);
const startHole=Math.min(18,Math.max(1,parseInt(current.match?.teeStartHole,10)||1));
for(let n=0;n<18;n++){
const h=(startHole-1+n)%18,value=current.holes[h][mode];
if(value===null)continue;
played++;hasScores=true;countedPar+=COURSE_CARDS[round].par[h];
if(running!==null){running+=value;cumulative[h]=running;}
}
const eligible=priorComplete&&(mode!=="net"||current.handicapValid);
return{player,start:priorComplete?start:null,total:eligible&&hasScores?running:null,strokes:eligible&&hasScores?countedPar+running:null,cumulative,played,eligible,hasScores};
}).filter(row=>row.eligible&&row.hasScores)
.sort((a,b)=>a.total-b.total||b.played-a.played||String(a.player.name).localeCompare(String(b.player.name)))
.slice(0,10);
return ranked.length?ranked:leaderboardPlaceholderRows(round);
}

async function savePar3Distance(round,hole,unit,el){
if(!canEditPar3(round))return;
const raw=el.value.trim(),value=Number(raw);
if(raw!==""&&(!Number.isInteger(value)||value<0||(unit==="inches"&&value>11))){
el.setCustomValidity(unit==="inches"?"Enter inches from 0 to 11.":"Enter whole feet, 0 or more.");el.reportValidity();return;
}
el.setCustomValidity("");
const key="R"+round+"H"+hole;
data.par3Distances??={};
const old={...(data.par3Distances[key]||{feet:"",inches:""})};
const distance={...old,[unit]:raw===""?"":value};
data.par3Distances[key]=distance;
try{
await upsert("tournament_par3_results",{
tournament_id:TOURNAMENT_ID,round_no:Number(round),hole:Number(hole),
player_id:data.par3Results[key]||null,
distance_feet:distance.feet===""?null:distance.feet,
distance_inches:distance.inches===""?null:distance.inches,
updated_at:new Date().toISOString()
},"tournament_id,round_no,hole");
}catch(e){
data.par3Distances[key]=old;el.value=old[unit];
alert("Distance could not be saved. Please try again.");
}
}
async function savePar3Winner(round,hole,playerId){
if(!canEditPar3(round)){
alert("You do not have access to change this result.");
render();return;
}
const key="R"+round+"H"+hole;
const old=data.par3Results[key]||"";
const oldDistance=data.par3Distances?.[key];
data.par3Results[key]=playerId||"";
render();
try{
if(!playerId){
await deleteRows("tournament_par3_results",{round_no:round,hole:hole});
delete data.par3Results[key];
if(data.par3Distances)delete data.par3Distances[key];
}else{
await upsert("tournament_par3_results",{
tournament_id:TOURNAMENT_ID,
round_no:Number(round),hole:Number(hole),
player_id:String(playerId),
distance_feet:data.par3Distances?.[key]?.feet===""?null:(data.par3Distances?.[key]?.feet??null),
distance_inches:data.par3Distances?.[key]?.inches===""?null:(data.par3Distances?.[key]?.inches??null),
updated_at:new Date().toISOString()
},"tournament_id,round_no,hole");

alert("Closest-to-the-pin winner could not be saved.");
}
}

function validateRound(){

const r=roundInfo(),m=setupMatches(),used=new Set();
for(let i=0;i<m.length;i++){

if(match.hackers.filter(Boolean).length!==required||
match.shankers.filter(Boolean).length!==required){
alert("Match "+(i+1)+" is incomplete.");return;
}
for(const id of [...match.hackers,...match.shankers]){
if(used.has(String(id))){

}
used.add(String(id));
}

}
alert("Round "+currentRound+" matchups are ready!");
}

function revealScoreInput(el){
const wrapper=el.closest(".tablewrap"),cell=el.closest("td");
if(!wrapper||!cell)return;
const wrapperRect=wrapper.getBoundingClientRect(),cellRect=cell.getBoundingClientRect();
const stickyWidth=el.closest("table").rows[0].cells[0].getBoundingClientRect().width;
const leftLimit=wrapperRect.left+stickyWidth+6,rightLimit=wrapperRect.right-6;
if(cellRect.left<leftLimit||cellRect.right>rightLimit){
const availableWidth=wrapper.clientWidth-stickyWidth;
const desiredLeft=wrapper.scrollLeft+cellRect.left-wrapperRect.left-stickyWidth-
Math.max(6,(availableWidth-cellRect.width)/2);
wrapper.scrollTo({left:Math.max(0,desiredLeft),behavior:"auto"});
}
}

// Match status is derived from the shared gross scores, so every device recalculates corrections.
function automaticMatch(round,match){
round=Number(round);
const empty={active:false,history:[],latest:null,finish:null};
if(![1,2,4].includes(round)||!match)return empty;
const needed=round===4?1:2;
const sides=[(match.hackers||[]).filter(Boolean),(match.shankers||[]).filter(Boolean)];
if(sides.some(ids=>ids.length!==needed||ids.some(id=>!getPlayer(id))))return empty;
const players=sides.flat().map(getPlayer),score=data.scores[match.id];
if(!score)return empty;
const valid=v=>v!==""&&v!=null&&Number.isInteger(Number(v))&&Number(v)>=1&&Number(v)<=20;
const active=(score.holes||[]).some(h=>players.some(p=>valid(h?.[p.id])));
let lead=0;const history=[];
for(const entry of liveHoleOrder(match)){
const h=entry.hole-1,hole=score.holes?.[h]||{};
if(players.some(p=>!valid(hole[p.id])))break;
const best=sides.map(ids=>Math.min(...ids.map(id=>{
const p=getPlayer(id),handicap=matchStrokeHandicap(p,round,match);
return Number(hole[id])-matchHoleStrokes(handicap,round,h);
})));
lead+=best[0]<best[1]?1:best[0]>best[1]?-1:0;
const row={round_no:round,match_no:match.matchNo,hole:entry.hole,holes_completed:entry.completed,
leader:lead===0?"All square":lead>0?"Hackers":"Shankers",margin:Math.abs(lead)};
history.push(row);
if(liveFinish(row))break;
}
const latest=history.at(-1)||null;
return {active,history,latest,finish:liveFinish(latest)};
}
function effectiveMatchResult(round,match){
const auto=automaticMatch(round,match);
return auto.active?(auto.finish?.winner||""):(data.results[match.id]?.winner||"");
}
function matchStatusCell(row){
if(!row)return '<td>—</td>';
const finish=liveFinish(row),label=finish?.label||(row.leader==="All square"?"A/S":row.margin+" UP");
const cls=row.leader==="Hackers"?"matchStatusHackers":row.leader==="Shankers"?"matchStatusShankers":"matchStatusTied";
const title=liveStatusText(row)+" after hole "+row.hole;
return '<td class="'+cls+'" title="'+escapeHtml(title)+'">'+escapeHtml(label)+'</td>';
}
function matchStatusRow(round,match){
if(![1,2,4].includes(Number(round)))return "";
const auto=automaticMatch(round,match);
const byHole=new Map(auto.history.map(row=>[Number(row.hole),row]));
let cells="";
for(let h=1;h<=18;h++){
cells+=matchStatusCell(byHole.get(h));
if(h===9)cells+=matchStatusCell(byHole.get(h));
}
cells+=matchStatusCell(byHole.get(18))+matchStatusCell(auto.latest);
return '<tr class="automaticMatchRow" id="match-status-'+match.id+'"><td><b>Match status</b></td>'+cells+'</tr>';
}

const latest=auto.active?auto.latest:liveHistory(liveMatchNo)[0];
banner.className="resultBanner "+(latest?.leader==="Hackers"?"resultHackers":latest?.leader==="Shankers"?"resultShankers":"resultHalved");
banner.innerHTML=latest?escapeHtml(liveStatusText(latest))+'<div style="font-size:13px;margin-top:5px">After hole '+latest.hole+' • '+latest.holes_completed+' holes played</div>':"Waiting for all player scores on the opening hole";
}

}

return '<div class="resultBanner '+(auto.latest.leader==="Hackers"?"resultHackers":auto.latest.leader==="Shankers"?"resultShankers":"resultHalved")+'">'+escapeHtml(liveStatusText(auto.latest))+
(auto.finish?" • FINAL":" • Thru "+auto.latest.holes_completed)+'</div>';
}

function matchStrokeHandicap(player,round,match){
if(![1,2,4].includes(Number(round)))return null;
const players=[...(match?.hackers||[]),...(match?.shankers||[])].map(getPlayer).filter(Boolean);

function liveHistory(matchNo){
const match=(data.matchups[liveRound]||[])[matchNo-1];

return liveStatuses.filter(r=>Number(r.round_no)===liveRound&&Number(r.match_no)===matchNo)

function liveFinish(row){
if(!row)return null;
const played=Number(row.holes_completed),margin=Number(row.margin);
if(!Number.isInteger(played)||played<1||played>18||!Number.isInteger(margin)||margin<0||margin>played)return null;
const remaining=18-played;
if(row.leader==="All square"&&margin===0&&remaining===0)return{winner:"Halved",label:"TIED"};
if((row.leader==="Hackers"||row.leader==="Shankers")&&margin>remaining){
return{winner:row.leader,label:remaining?margin+"&"+remaining:margin+"UP"};
}
return null;
}
function liveStatusText(row){
const finish=liveFinish(row);
if(finish)return finish.winner==="Halved"?"Final — Tied":finish.winner+" win "+finish.label;
return row.leader==="All square"?"Tied (All Square)":row.leader+" "+row.margin+" UP";

async function saveLiveStatus(){
if(liveSaving||!canScoreRound(liveRound))return;
const roundNo=liveRound,matchNo=liveMatchNo,match=liveRoundMatches()[matchNo-1];
const required=liveRoundInfo().type==="singles"?1:2;
if(![match.hackers,match.shankers].every(ids=>(ids||[]).filter(id=>getPlayer(id)).length===required))return;
const hole=Number(document.getElementById("liveHole").value);
const value=Number(document.getElementById("liveStatus").value);
const completed=liveHoleOrder(match).find(x=>x.hole===hole)?.completed;
if(!completed||!Number.isInteger(value)||Math.abs(value)>completed)return;
const row={tournament_id:TOURNAMENT_ID,round_no:roundNo,match_no:matchNo,hole,
holes_completed:completed,leader:value===0?"All square":value>0?"Hackers":"Shankers",
margin:Math.abs(value),updated_at:new Date().toISOString()};
liveDraft={matchNo,hole,value};liveSaving=true;liveNotice="";
const saveButton=document.getElementById("liveSaveButton");
if(saveButton){saveButton.disabled=true;saveButton.setAttribute("aria-busy","true")}
const saveStatus=document.getElementById("liveSaveStatus");
if(saveStatus)saveStatus.textContent="Saving match status…";
try{
await upsert("tournament_live_status",row,"tournament_id,round_no,match_no,hole");
liveStatuses=liveStatuses.filter(r=>!(Number(r.round_no)===roundNo&&Number(r.match_no)===matchNo&&Number(r.holes_completed)>=completed));
liveStatuses.push(row);liveDraft=null;liveNotice="Match status saved on this phone; see upload status above.";
const latest=liveStatuses.filter(r=>Number(r.round_no)===roundNo&&Number(r.match_no)===matchNo)
.sort((a,b)=>Number(b.holes_completed)-Number(a.holes_completed))[0];
const finish=liveFinish(latest);
if(finish){
// The live-status database trigger saves the result in the same transaction.
data.results[match.id]={winner:finish.winner};
liveNotice="Pending upload • "+(finish.winner==="Halved"?"Match halved — half a point awarded to each team.":finish.winner+" win "+finish.label+" — 1 point awarded.");
}else if(data.results[match.id]){
delete data.results[match.id];
liveNotice="Match status corrected — match is in progress and the final point was removed.";
}
}catch(e){console.error(e);liveDraft={matchNo,hole,value};liveNotice="Could not finish saving the match status and result. Save this status again to retry.";}
finally{liveSaving=false;render();}
}

function getScatResults(roundId,group){
const r=ROUNDS.find(x=>x.id===roundId);
if(!r||!r.scats)return[];
const matches=data.matchups[roundId]||[],results=[];
for(let h=0;h<18;h++){
const entered=[];
matches.forEach(match=>{
if(!match)return;
const sd=data.scores[match.id];
if(!sd)return;
const s=sd.holes[h]||{};
[...(match.hackers||[]),...(match.shankers||[])].forEach(id=>{
const p=getPlayer(id);
if(!p||p.group!==group)return;
const v=Number(s[p.id]);
if(v>0)entered.push({id:p.id,name:p.name,score:v});
});
});
if(!entered.length){
results.push({hole:h+1,status:"none"});continue;
}
const low=Math.min(...entered.map(x=>x.score));
const winners=entered.filter(x=>x.score===low);
results.push(winners.length===1?
{hole:h+1,status:"scat",winner:winners[0],score:low,entered:entered.length}:
{hole:h+1,status:"tie",score:low,winners,entered:entered.length});
}
return results;
}

function scatSummary(roundId,group){
const counts={};
getScatResults(roundId,group).forEach(r=>{
if(r.status!=="scat")return;
const id=String(r.winner.id);
if(!counts[id])counts[id]={name:r.winner.name,count:0};
counts[id].count++;
});
return Object.values(counts).sort((a,b)=>b.count-a.count);
}

${x.count} ${x.count===1?"scat":"scats"}</span>`).join("")}`:""}
<h3>Hole-by-Hole</h3>

ROUNDS.filter(r=>r.scats).forEach(r=>{

const THURSDAY_GROUPS=[
{id:4,time:"12:30 PM",players:["Chuck Stouch","Tony Borsuk","Pat Sweeney","John Blair"]},
{id:2,time:"12:40 PM",players:["Joe Pace","Jack Kelly","Jim Cap","Rob Sladek"]},
{id:3,time:"12:50 PM",players:["Rob McCabe","Bob Pace","Mookie","Derek"]},
{id:1,time:"1:00 PM",players:["Rocco Pace","Justin Stroh","Ross Riley","Jeff Blair"]}
];

// Thursday teams are independent of tee-time foursomes. Keep group/player score keys unchanged.
const THURSDAY_TEAMS=[
{id:1,members:[[4,1],[4,2],[4,3],[3,2]],indices:[22,9,20.9,8.2]},
{id:2,members:[[4,4],[2,1],[3,4],[1,1]],indices:[22,21.4,7,9.8]},
{id:3,members:[[2,2],[2,3],[3,1],[3,3]],indices:[13.1,21.4,19.7,6]},
{id:4,members:[[2,4],[1,2],[1,3],[1,4]],indices:[17.9,4.8,22,15]}
];
// Thursday net Stableford uses an 85% handicap allowance and hole stroke indexes.
const THURSDAY_CARD={par:[4,3,4,4,5,4,5,3,4,4,5,3,4,4,5,3,4,4],hcp:[11,17,9,7,1,13,3,15,5,4,2,16,8,6,10,18,14,12]};
function thursdayCardReady(){
const c=THURSDAY_CARD;
return !!c&&c.par?.length===18&&c.par.every(v=>Number.isInteger(v)&&v>=3&&v<=6);
}
function thursdayTeam(g,p){return THURSDAY_TEAMS.find(t=>t.members.some(m=>m[0]===g&&m[1]===p))}
function thursdayPlayerName(g,p){return THURSDAY_GROUPS.find(group=>group.id===g)?.players[p-1]||""}
// Apply the 85% allowance to the unrounded tee-specific course handicap, then round.
const THURSDAY_TEES={White:{rating:71.1,slope:131},Gold:{rating:68.9,slope:124}};
function thursdayPlayerHandicap(g,p){
const name=thursdayPlayerName(g,p);
const teeName=(name==="Rob McCabe"||name==="John Blair")?"Gold":"White";
const tee=THURSDAY_TEES[teeName];
const team=thursdayTeam(g,p),member=team.members.findIndex(m=>m[0]===g&&m[1]===p);
const player=data.players.find(player=>String(player.name).trim().toLowerCase()===name.toLowerCase());
const liveIndex=player?.handicap;
const index=liveIndex!==null&&liveIndex!==undefined&&String(liveIndex).trim()!==""&&Number.isFinite(Number(liveIndex))?Number(liveIndex):team.indices[member];
const par=THURSDAY_CARD.par.reduce((a,b)=>a+b,0);
const courseHandicap=index*tee.slope/113+tee.rating-par;
return {tee:teeName,index,handicap:Math.round(courseHandicap),playingHandicap:Math.round(courseHandicap*0.85)};
}
function thursdayHandicapStrokes(g,p,h){
const handicap=thursdayPlayerHandicap(g,p).playingHandicap;
if(handicap>=0)return Math.floor(handicap/18)+(THURSDAY_CARD.hcp[h-1]<=handicap%18?1:0);
const given=-handicap;
return -(Math.floor(given/18)+(THURSDAY_CARD.hcp[h-1]>18-given%18?1:0));
}
function thursdayStrokeDots(g,p,h){
const strokes=thursdayHandicapStrokes(g,p,h);
if(strokes<=0)return "";
return '<span class="thursdayStrokeDots" aria-hidden="true">'+("•".repeat(strokes))+'</span>';
}
function thursdayPoints(g,p,h){
const score=thursdayValue(g,p,h);
if(score===""||!thursdayCardReady())return null;
return Math.max(0,2+THURSDAY_CARD.par[h-1]-Number(score)+thursdayHandicapStrokes(g,p,h));
}
function thursdayPointSum(g,p,start=1,end=18){
const points=Array.from({length:end-start+1},(_,i)=>thursdayPoints(g,p,start+i)).filter(v=>v!==null);
return points.length?points.reduce((a,b)=>a+b,0):null;
}
function thursdayPointsRow(g,p){
let cells="";
for(let h=1;h<=18;h++){
cells+='<td id="thursday-points-'+g+'-'+p+'-'+h+'">'+(thursdayPoints(g,p,h)??"—")+'</td>';
if(h===9)cells+='<td class="summaryCell" id="thursday-points-out-'+g+'-'+p+'">'+(thursdayPointSum(g,p,1,9)??"—")+'</td>';
}
return '<tr class="thursdayPointsRow" aria-label="'+escapeHtml(thursdayPlayerName(g,p))+' Stableford points"><td><b>Stableford points</b></td>'+cells+
'<td class="summaryCell" id="thursday-points-in-'+g+'-'+p+'">'+(thursdayPointSum(g,p,10,18)??"—")+'</td>'+
'<td class="summaryCell" id="thursday-points-total-'+g+'-'+p+'">'+(thursdayPointSum(g,p)??"—")+'</td></tr>';
}
function thursdayLeaderboard(){
const ready=thursdayCardReady();
const teams=THURSDAY_TEAMS.map(t=>{
const entered=t.members.reduce((n,[g,p])=>n+Array.from({length:18},(_,h)=>thursdayValue(g,p,h+1)).filter(v=>v!=="").length,0);
const points=t.members.map(([g,p])=>thursdayPointSum(g,p));
return {...t,entered,points:points.every(v=>v===null)?null:points.reduce((a,b)=>a+(b??0),0)};
}).sort((a,b)=>(b.points??-1)-(a.points??-1)||a.id-b.id);
const complete=ready&&teams.every(t=>t.entered===72);
return '<h2>Thursday Stableford</h2><p class="thursdayBoardNote">Team leaderboard • Highest points wins</p>'+
(!ready?'<div class="notice">Awaiting hole pars to calculate points. Gross scores can still be entered.</div>':'')+
'<div class="tablewrap"><table class="thursdayTeamTable"><thead><tr><th aria-label="Place">#</th><th>Team / Players</th><th>Pts</th></tr></thead><tbody>'+
teams.map((t,i)=>{
const rank=t.points===null?"—":(teams.findIndex(x=>x.points===t.points)+1);
const tied=t.points!==null&&teams.filter(x=>x.points===t.points).length>1;
const winner=complete&&t.points===teams[0].points;
return '<tr'+(i===0&&t.points!==null?' class="thursdayLeader"':'')+'><td>'+rank+(tied?'T':'')+'</td><td><b>Team '+t.id+
(winner?(tied?' • Tied winners':' • Winner'):'')+'</b><div class="muted">'+
[t.members.slice(0,2),t.members.slice(2)].map(pair=>'<span class="thursdayTeamMember">'+pair.map(([g,p])=>escapeHtml(thursdayPlayerName(g,p))).join(' · ')+'</span>').join('')+
'</div></td><td class="thursdayTeamPoints">'+(t.points??"—")+'<span class="thursdayTeamProgress">'+t.entered+'/72 holes</span></td></tr>';
}).join("")+'</tbody></table></div><p class="thursdayBoardKey">Net points (85% HCP): Double+ 0 · Bogey 1 · Par 2 · Birdie 3 · Eagle 4 · Albatross 5</p>';
}
function refreshThursdayPoints(g,p){
for(let h=1;h<=18;h++){
const cell=document.getElementById("thursday-points-"+g+"-"+p+"-"+h);
if(cell)cell.textContent=thursdayPoints(g,p,h)??"—";
}
for(const [label,start,end] of [["out",1,9],["in",10,18],["total",1,18]]){
const cell=document.getElementById("thursday-points-"+label+"-"+g+"-"+p);
if(cell)cell.textContent=thursdayPointSum(g,p,start,end)??"—";
}
const board=document.getElementById("thursdayLeaderboard");
if(board)board.innerHTML=thursdayLeaderboard();
}

let thursdayScores=[],thursdaySaving=0,thursdayNotice="";
function thursdayValue(g,p,h){
return thursdayScores.find(r=>r.group_no===g&&r.player_no===p&&r.hole===h)?.score??"";
}
function thursdaySum(g,p,start,end){
const values=Array.from({length:end-start+1},(_,i)=>thursdayValue(g,p,start+i)).filter(v=>v!=="");
return values.length?values.reduce((a,b)=>a+Number(b),0):"";
}
function thursdayTotals(g,p){
refreshThursdayPoints(g,p);
for(const [label,start,end] of [["out",1,9],["in",10,18],["total",1,18]]){
const cell=document.getElementById("thursday-"+label+"-"+g+"-"+p);
if(cell)cell.textContent=thursdaySum(g,p,start,end);
}
}
async function saveThursdayScore(g,p,h,el){
if(!canScore())return;
const raw=el.value.trim(),value=Number(raw);
if(raw!==""&&(!Number.isInteger(value)||value<1||value>20)){
el.setCustomValidity("Enter a whole number from 1 to 20.");el.reportValidity();return;
}
el.setCustomValidity("");
const previous=thursdayValue(g,p,h);
thursdayScores=thursdayScores.filter(r=>!(r.group_no===g&&r.player_no===p&&r.hole===h));
const row={tournament_id:TOURNAMENT_ID,group_no:g,player_no:p,hole:h,score:value};
if(raw!=="")thursdayScores.push(row);
thursdayTotals(g,p);thursdaySaving++;
// Keep inputs enabled so saving never dismisses the mobile keyboard.
el.setAttribute("aria-busy","true");
try{
if(raw==="")await deleteRows("tournament_thursday_scores",{group_no:g,player_no:p,hole:h});
else await upsert("tournament_thursday_scores",row,"tournament_id,group_no,player_no,hole");
thursdayNotice="Saved on this phone. Upload status is shown above.";
}catch(e){
thursdayScores=thursdayScores.filter(r=>!(r.group_no===g&&r.player_no===p&&r.hole===h));
if(previous!=="")thursdayScores.push({...row,score:previous});
el.value=previous;thursdayTotals(g,p);
thursdayNotice="Score could not be saved. Please try again.";
}finally{
thursdaySaving--;el.removeAttribute("aria-busy");
const status=document.getElementById("thursdayStatus");if(status)status.textContent=thursdayNotice;
}
}
function handleThursdayScoreInput(el){
clearTimeout(scoreAdvanceTimer);
const raw=String(el.value??"").trim(),value=Number(raw);
if(!canScore()||raw===""||!Number.isInteger(value)||value<1||value>20)return;
scoreAdvanceTimer=setTimeout(()=>{
if(document.activeElement===el)advanceScoreInput(el);
},raw==="1"?450:200);
}
function thursdayPage(){
return `<div class="card" id="thursdayLeaderboard">${thursdayLeaderboard()}</div><div class="card"><h2>Thursday Round</h2>
<div><b>Whispering Pines - Pines Course</b></div>
<p class="muted">White: 71.1 / 131 • Gold: 68.9 / 124 • Par 72</p>
<p class="muted">18-hole net Stableford • 85% handicaps • Four teams of four</p>
<p class="muted">Enter gross strokes. Net Stableford points use 85% of each player’s tee-specific course handicap, rounded to a whole stroke and allocated by the hole handicap rankings. Points and team totals update automatically. • = 1 handicap stroke; •• = 2 strokes.</p>
${!canScore()?'<div class="viewer">Sign in with scoring access to enter scores.</div>':""}
<div id="thursdayStatus" role="status">${escapeHtml(thursdayNotice)}</div></div>
${THURSDAY_GROUPS.map((group,gi)=>{
const g=group.id;
return `<div class="card"><h2>Group ${gi+1} • ${group.time}</h2>
<p>${group.players.map(escapeHtml).join(" • ")}</p>
<div class="tablewrap"><table class="scoretable">${scoreHeader()}${thursdayCardReady()?scoreReferenceRow(THURSDAY_CARD.par,"PAR",true):""}${scoreReferenceRow(THURSDAY_CARD.hcp,"HCP")}
${group.players.map((name,pi)=>{
const p=pi+1;let cells="";
for(let h=1;h<=18;h++){
cells+=`<td><span class="thursdayScoreBox">${thursdayStrokeDots(g,p,h)}<input class="scoreInput" type="number" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" min="1" max="20" step="1" value="${thursdayValue(g,p,h)}"
aria-label="${escapeHtml(name)} hole ${h}, ${thursdayHandicapStrokes(g,p,h)} handicap strokes" ${canScore()?"":"disabled"}
onfocus="selectScoreInput(this)" onclick="selectScoreInput(this)"
 onkeydown="handleScoreKeydown(event,this)" oninput="handleThursdayScoreInput(this)" onchange="saveThursdayScore(${g},${p},${h},this)"></span></td>`;
if(h===9)cells+=`<td class="summaryCell" id="thursday-out-${g}-${p}">${thursdaySum(g,p,1,9)}</td>`;
}
return `<tr><td><b>${escapeHtml(name)}</b><div class="muted">85% HCP ${thursdayPlayerHandicap(g,p).playingHandicap} • ${thursdayPlayerHandicap(g,p).tee}</div><div class="muted">Team ${thursdayTeam(g,p).id} • Strokes</div></td>${cells}
<td class="summaryCell" id="thursday-in-${g}-${p}">${thursdaySum(g,p,10,18)}</td>
<td class="summaryCell" id="thursday-total-${g}-${p}">${thursdaySum(g,p,1,18)}</td></tr>${thursdayPointsRow(g,p)}`;
}).join("")}</table></div></div>`;
}).join("")}`;
}

let offlinePageReady=false;
function drawOfflineReadyStatus(){
const box=document.getElementById("offlineReadyStatus");
if(!box)return;
const hasData=Object.keys(sharedBatches).length>0;
box.textContent=offlinePageReady?(hasData?(canScore()?"✓ Offline scoring ready on this phone":"✓ Offline page ready • Sign in with scoring access before losing signal"):
"Offline page ready • Connect to download the tournament before playing"):
"Preparing offline access — keep this page open while online.";
}
async function prepareOfflinePage(){
if(!('serviceWorker' in navigator)){
const box=document.getElementById("offlineReadyStatus");
if(box)box.textContent="This browser does not support reopening the app offline.";
return;
}
try{
const existing=await navigator.serviceWorker.getRegistration('./');
if(existing?.active){offlinePageReady=true;drawOfflineReadyStatus()}
await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
await navigator.serviceWorker.ready;
offlinePageReady=true;drawOfflineReadyStatus();
}catch{
const box=document.getElementById("offlineReadyStatus");
if(box)box.textContent="Offline page is not ready yet. Open again with signal before playing.";
}
}
function restorePhoneAccess(){
currentUser=session?.user||null;userRole="viewer";userTeam=null;
if(!currentUser)return;
try{const cached=JSON.parse(localStorage.getItem("duffers-role:"+currentUser.id)||"null");
if(cached){userRole=cached.role;userTeam=cached.team}}catch{}
if(String(currentUser.email||"").toLowerCase()===OWNER_EMAIL){userRole="owner";userTeam=null}
}
async function start(){
loadStoredSession();restorePhoneAccess();
const offlineLaunch=navigator.onLine===false||window.__duffersOfflineLaunch===true;
if(offlineLaunch)page="live";
// Render saved matchups and pending scores before waiting for any network request.
await loadSharedData(false,true);
render();prepareOfflinePage();
if(offlineLaunch)return;
await refreshSessionIfNeeded();
await loadCurrentUser();
if(isSignedIn())await loadMyPermissions();
await loadSharedData(false);
if(!connected)page="live";
if(connected&&isOwner())await loadTournamentUsers();
render();
recordVisitorEvent("visit",page);
flushPendingChanges();
}

start();
</script>

<script>
function scheduleDetails(roundId){
  const schedule=TOURNAMENT_SCHEDULE[roundId];
  if(!schedule)return "";

  const showBreakfast=Number(roundId)!==3&&!!schedule.breakfast;

  return `
    <dl class="scheduleDetails${showBreakfast?"":" noBreakfast"}">
      ${showBreakfast?`
        <div class="scheduleDetail">
          <dt>Breakfast delivery</dt>
          <dd>${escapeHtml(schedule.breakfast)}</dd>
        </div>
      `:""}

      <div class="scheduleDetail">
        <dt>Leave time</dt>
        <dd>${escapeHtml(schedule.leave)}</dd>
      </div>

      <div class="scheduleDetail">
        <dt>${escapeHtml(schedule.driveFrom)}</dt>
        <dd>${escapeHtml(schedule.drive)}</dd>
      </div>
    </dl>

    ${schedule.note?`
      <p class="scheduleNote">${escapeHtml(schedule.note)}</p>
    `:""}
  `;
}

render();
</script>
