function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");
}

function isOwner(){
return access.role==="owner";
}

function canScore(){
return ["owner","captain","scorer"].includes(access.role);
}

function canEditPlayers(){

}

function canManageUsers(){

function canEditSide(side){
if(isOwner())return true;

if(side==="hackers")return access.team==="Hackers";

function roleLabel(){
if(access.role==="owner")return "OWNER";
if(access.role==="captain")return access.team+" CAPTAIN";
if(access.role==="scorer")return "SCORER";

}

function loadStoredSession(){
try{
session=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");
}catch{
session=null;
}
}

function storeSession(x){
session=x;
if(x)localStorage.setItem(SESSION_KEY,JSON.stringify(x));
else localStorage.removeItem(SESSION_KEY);
}

function authToken(){
return session&&session.access_token?session.access_token:SUPABASE_KEY;
}

async function refreshSessionIfNeeded(){
if(!session||!session.refresh_token)return;

const expiresAt=Number(session.expires_at||0);
const now=Math.floor(Date.now()/1000);

if(expiresAt&&expiresAt-now>120)return;

try{
const r=await fetch(
SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",
{
method:"POST",
headers:{
apikey:SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({refresh_token:session.refresh_token})
}
);

if(!r.ok)throw new Error("Refresh failed");

const x=await r.json();
x.expires_at=Math.floor(Date.now()/1000)+Number(x.expires_in||3600);
storeSession(x);

}catch{
storeSession(null);
authUser=null;
access={role:"viewer",team:null,email:""};
}
}

async function checkAccess(){
authUser=null;
access={role:"viewer",team:null,email:""};

if(!session||!session.access_token)return;

try{
const r=await fetch(
SUPABASE_URL+"/auth/v1/user",
{
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+session.access_token
}
}
);

if(!r.ok)return;

authUser=await r.json();

const email=String(authUser.email||"").toLowerCase();

const url=
SUPABASE_URL+
"/rest/v1/tournament_users?tournament_id=eq."+
encodeURIComponent(TOURNAMENT_ID)+
"&user_id=eq."+
encodeURIComponent(authUser.id)+
"&select=*";

const p=await fetch(url,{headers:headers()});

if(p.ok){
const rows=await p.json();

if(rows.length){
access={
role:rows[0].role||"viewer",
team:rows[0].team||null,
email:rows[0].email||email
};
return;
}
}

if(email===OWNER_EMAIL){
access={role:"owner",team:null,email};
}else{
access={role:"viewer",team:null,email};
}

}catch(e){
console.error(e);
}
}

function headers(extra={}){
return{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+authToken(),
"Content-Type":"application/json",
...extra
};
}

async function apiGet(table){
await refreshSessionIfNeeded();

const url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?tournament_id=eq."+
encodeURIComponent(TOURNAMENT_ID)+
"&select=*";

const r=await fetch(url,{headers:headers()});

if(!r.ok)throw new Error("Database read failed: "+table);

return await r.json();
}

async function upsert(table,row,conflict){
await refreshSessionIfNeeded();

const url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?on_conflict="+
encodeURIComponent(conflict);

const r=await fetch(url,{
method:"POST",
headers:headers({
Prefer:"resolution=merge-duplicates,return=minimal"
}),
body:JSON.stringify(row)
});

if(!r.ok){
const msg=await r.text();
console.error(msg);
throw new Error("Database save failed");
}
}

async function patchRows(table,filters,row){
await refreshSessionIfNeeded();

let url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?tournament_id=eq."+
encodeURIComponent(TOURNAMENT_ID);

Object.entries(filters).forEach(([k,v])=>{
url+="&"+k+"=eq."+encodeURIComponent(v);
});

const r=await fetch(url,{
method:"PATCH",
headers:headers({Prefer:"return=minimal"}),
body:JSON.stringify(row)
});

if(!r.ok){
const msg=await r.text();
console.error(msg);
throw new Error("Database update failed");
}
}

async function deleteRows(table,filters){
await refreshSessionIfNeeded();

let url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?tournament_id=eq."+
encodeURIComponent(TOURNAMENT_ID);

Object.entries(filters).forEach(([k,v])=>{
url+="&"+k+"=eq."+encodeURIComponent(v);
});

const r=await fetch(url,{
method:"DELETE",
headers:headers()
});

if(!r.ok){
console.error(await r.text());
throw new Error("Database delete failed");
}
}

async function loadSharedData(rerender=true){
try{
const [players,matchups,scores,results]=await Promise.all([
apiGet("tournament_players"),
apiGet("tournament_matchups"),
apiGet("tournament_scores"),
apiGet("tournament_results")
]);

data.players=players.map(r=>({
id:r.id,
name:r.name,
handicap:r.handicap,
team:r.team,
group:r.group_name
}));

data.matchups={};

matchups.forEach(r=>{
if(!data.matchups[r.round_no])data.matchups[r.round_no]=[];

data.matchups[r.round_no][r.match_no-1]={
id:"R"+r.round_no+"M"+r.match_no,
matchNo:r.match_no,
hackers:r.hackers||[],
shankers:r.shankers||[]
};
});

data.scores={};

scores.forEach(r=>{
const id="R"+r.round_no+"M"+r.match_no;

if(!data.scores[id]){
data.scores[id]={holes:Array.from({length:18},()=>({}))};
}

data.scores[id].holes[r.hole-1][r.scorer_key]=r.score;
});

data.results={};

results.forEach(r=>{
data.results["R"+r.round_no+"M"+r.match_no]={winner:r.winner};
});

if(isOwner()){
try{
data.users=await apiGet("tournament_users");
}catch{
data.users=[];
}
}

connected=true;
drawConnectionStatus();

if(rerender)render();

}catch(e){
console.error(e);
connected=false;
drawConnectionStatus();
}
}

function teamPoints(){
let hackers=0,shankers=0,completed=0;

Object.values(data.results).forEach(r=>{
if(!r)return;

if(r.winner==="Hackers"){
hackers++;
completed++;
}else if(r.winner==="Shankers"){
shankers++;
completed++;
}else if(r.winner==="Halved"){
hackers+=.5;
shankers+=.5;
completed++;
}
});

return{hackers,shankers,completed};
}

async function setMatchPlayer(i,side,slot,playerId){
if(!canEditSide(side))return;

const match=data.matchups[currentRound][i];
const previous=match[side][slot];

match[side][slot]=playerId;

try{
/*
Only the side being edited is sent.
This preserves captain team-side permissions.
*/
await patchRows(
"tournament_matchups",
{
round_no:currentRound,
match_no:i+1
},
{
[side]:match[side]
}
);

}catch(e){
/*
If this matchup row does not exist yet, owner can create it.
*/
if(isOwner()){
try{
await upsert(
"tournament_matchups",
{
tournament_id:TOURNAMENT_ID,
round_no:currentRound,
match_no:i+1,
hackers:match.hackers,
shankers:match.shankers
},
"tournament_id,round_no,match_no"
);
}catch(err){
console.error(err);
match[side][slot]=previous;
alert("Matchup could not be saved.");
}
}else{
console.error(e);
match[side][slot]=previous;
alert("Matchup could not be saved.");
}
}

render();
}

function validateRound(){
if(!isOwner())return;

const r=roundInfo();
const m=setupMatches();
const used=new Set();

for(let i=0;i<m.length;i++){
const match=m[i];
const required=r.type==="singles"?1:2;

if(
match.hackers.filter(Boolean).length!==required||
match.shankers.filter(Boolean).length!==required
){
alert("Match "+(i+1)+" is incomplete.");
return;
}

for(const id of [...match.hackers,...match.shankers]){
if(used.has(String(id))){
alert("A player is used more than once in this round.");
return;
}
used.add(String(id));
}
}

if(used.size!==32){
alert("All 32 players must appear exactly once.");
return;
}

alert("Round "+currentRound+" matchups are ready!");
}

function getScore(id){
if(!data.scores[id]){
data.scores[id]={holes:Array.from({length:18},()=>({}))};
}

while(data.scores[id].holes.length<18)data.scores[id].holes.push({});

return data.scores[id];
}

function enteredNine(score,id,start){
let total=0;

for(let h=start;h<start+9;h++){
const v=Number((score.holes[h]||{})[id]);

if(!(v>0))return"—";

total+=v;
}

return total;
}

function enteredTotal(score,id){
const out=enteredNine(score,id,0);
const inn=enteredNine(score,id,9);

if(out==="—"||inn==="—")return"—";

return out+inn;
}

function nineTotal(values,start){
return values.slice(start,start+9).reduce((a,b)=>a+Number(b||0),0);
}

function scoreHeader(){
return`
<tr>
<th>PLAYER</th>
${Array.from({length:9},(_,i)=>`<th>${i+1}</th>`).join("")}
<th>OUT</th>
${Array.from({length:9},(_,i)=>`<th>${i+10}</th>`).join("")}
<th>IN</th>
<th>TOTAL</th>
</tr>
`;
}

function scoreReferenceRow(values,label,showTotals=false){
return`
<tr class="${label==="PAR"?"coursePar":"courseHcp"}">

<td>${label}</td>

${values.slice(0,9).map(v=>`<td>${v}</td>`).join("")}

<td class="summaryCell">
${showTotals?nineTotal(values,0):""}
</td>

${values.slice(9).map(v=>`<td>${v}</td>`).join("")}

<td class="summaryCell">
${showTotals?nineTotal(values,9):""}
</td>

<td class="summaryCell">
${showTotals?values.reduce((a,b)=>a+b,0):""}
</td>

</tr>
`;
}

function playerScoreRow(p,score,round,matchNo,matchId){
const cls=p.team==="Hackers"?"hackerScoreRow":"shankerScoreRow";

type="number"
inputmode="numeric"
pattern="[0-9]*"

oninput="queueScore(${round},${matchNo},'${matchId}',${h},'${p.id}',this.value)">

}

cells+=`
<td class="summaryCell">
${enteredNine(score,p.id,0)}
</td>
`;

for(let h=9;h<18;h++){
const value=(score.holes[h]||{})[p.id]??"";

cells+=`
<td>
<input
type="number"
inputmode="numeric"
pattern="[0-9]*"
min="1"
max="20"
${canScore()?"":"disabled"}
value="${value}"
oninput="queueScore(${round},${matchNo},'${matchId}',${h},'${p.id}',this.value)">
</td>
`;
}

cells+=`
<td class="summaryCell">
${enteredNine(score,p.id,9)}
</td>

<td class="summaryCell">
${enteredTotal(score,p.id)}
</td>
`;

return`
<tr class="${cls}">
<td>
${esc(p.name)}
<br>
<span class="muted">
HCP ${esc(p.handicap)} • Group ${esc(p.group)}
</span>
</td>
${cells}
</tr>

}

function queueScore(round,matchNo,matchId,holeIndex,scorer,value){
if(!canScore())return;

const score=getScore(matchId);

score.holes[holeIndex][scorer]=value===""?"":Number(value);

const key=round+"-"+matchNo+"-"+holeIndex+"-"+scorer;

clearTimeout(saveTimers[key]);

saveTimers[key]=setTimeout(
()=>saveScoreOnline(round,matchNo,holeIndex+1,scorer,value),
350
);
}

async function saveScoreDirect(round,matchNo,hole,scorer,value){
await upsert(
"tournament_scores",
{
tournament_id:TOURNAMENT_ID,
round_no:round,
match_no:matchNo,
hole,
scorer_key:String(scorer),
score:Number(value)
},
"tournament_id,round_no,match_no,hole,scorer_key"
);
}

async function saveScoreOnline(round,matchNo,hole,scorer,value){
if(!canScore())return;

try{
if(value===""){
await deleteRows(
"tournament_scores",
{
round_no:round,
match_no:matchNo,
hole,
scorer_key:scorer
}
);
}else{
await saveScoreDirect(
round,
matchNo,
hole,
scorer,
Number(value)
);
}
}catch(e){
console.error(e);
}
}

async function saveMatchResult(round,matchNo,matchId){
if(!canScore()){
alert("Scoring access required.");
return;
}

const box=document.getElementById("result-"+matchId);
if(!box)return;

const winner=box.value;

try{
if(winner===""){
await deleteRows(
"tournament_results",
{
round_no:round,
match_no:matchNo
}
);

delete data.results[matchId];
render();
return;
}

await upsert(
"tournament_results",
{
tournament_id:TOURNAMENT_ID,
round_no:round,
match_no:matchNo,
winner
},
"tournament_id,round_no,match_no"
);

data.results[matchId]={winner};
render();

}catch(e){
console.error(e);
alert("Match result could not be saved or reset.");
}
}

/* ==========================================================
   SKINS
   ========================================================== */

function getSkinResults(roundId,group){
const r=ROUNDS.find(x=>x.id===roundId);

if(!r||!r.skins)return[];

const matches=data.matchups[roundId]||[];
const results=[];

for(let h=0;h<18;h++){
const entered=[];

matches.forEach(match=>{
if(!match)return;

const sd=data.scores[match.id];
if(!sd)return;

const s=sd.holes[h]||{};

[
...(match.hackers||[]),
...(match.shankers||[])
].forEach(id=>{
const p=getPlayer(id);

if(!p||p.group!==group)return;

const v=Number(s[p.id]);

if(v>0){
entered.push({
id:p.id,
name:p.name,
score:v
});
}
});
});

if(!entered.length){
results.push({hole:h+1,status:"none"});
continue;
}

const low=Math.min(...entered.map(x=>x.score));
const winners=entered.filter(x=>x.score===low);

results.push(
winners.length===1
?{
hole:h+1,
status:"skin",
winner:winners[0],
score:low,
entered:entered.length
}
:{
hole:h+1,
status:"tie",
score:low,
winners,
entered:entered.length
}
);
}

return results;
}

function skinSummary(roundId,group){
const counts={};

getSkinResults(roundId,group).forEach(r=>{
if(r.status!=="skin")return;

const id=String(r.winner.id);

if(!counts[id]){
counts[id]={
name:r.winner.name,
count:0
};
}

counts[id].count++;
});

return Object.values(counts).sort((a,b)=>b.count-a.count);
}

function skinGroupCard(round,group){
const results=getSkinResults(round.id,group);
const summary=skinSummary(round.id,group);
const won=results.filter(r=>r.status==="skin").length;

return`
<div class="card">

<h2>Group ${group}</h2>

<div class="skinCount">${won} skins won</div>

${summary.length
?`
<h3>Skin Leaders</h3>

${summary.map(x=>`
<span class="pill">
<b>${esc(x.name)}</b> —
${x.count} ${x.count===1?"skin":"skins"}
</span>
`).join("")}
`
:""}

<h3>Hole-by-Hole</h3>

${results.map(r=>
r.status==="skin"
?`
<div class="skinWinner">
<b>Hole ${r.hole} — SKIN</b><br>
${esc(r.winner.name)} — ${r.score}<br>
<span class="muted">
${r.entered} entered score${r.entered===1?"":"s"}
</span>
</div>
`
:r.status==="tie"
?`
<div class="skinTie">
<b>Hole ${r.hole} — NO SKIN</b><br>
Tie at ${r.score}<br>
${r.winners.map(p=>esc(p.name)).join(", ")}
</div>
`
:`
<div class="skinNone">
<b>Hole ${r.hole}</b> — No scores entered
</div>
`
).join("")}

</div>
`;
}

function skinsPage(){
const rounds=ROUNDS.filter(r=>r.skins);

return`
<div class="card">
<h2>Skins</h2>
<div class="muted">
Gross scores • lowest unique score wins • ties = no skin • no carryovers
</div>
</div>

${rounds.map(r=>`
<div class="card">
<h2>Round ${r.id} — ${r.course}</h2>
<div class="muted">${r.format}</div>
</div>

${skinGroupCard(r,"A")}
${skinGroupCard(r,"B")}
`).join("")}
`;
}

function roleBadge(u){
const role=u.role||"viewer";

let cls="roleViewer";
let text="No Access";

if(role==="owner"){
cls="roleOwner";
text="Owner";
}else if(role==="captain"){
cls="roleCaptain";
text=(u.team||"")+" Captain";
}else if(role==="scorer"){
cls="roleScorer";
text="Scorer";
}

return`<span class="roleBadge ${cls}">${esc(text)}</span>`;
}

async function changeUserRole(userId,value){
if(!canManageUsers())return;

let role="viewer";
let team=null;

if(value==="scorer"){
role="scorer";
}else if(value==="captain_hackers"){
role="captain";
team="Hackers";
}else if(value==="captain_shankers"){
role="captain";
team="Shankers";
}

try{
await patchRows(
"tournament_users",
{user_id:userId},
{role,team}
);

await loadSharedData(false);
render();

}catch(e){
console.error(e);
alert("User access could not be changed.");
}
}

async function createAccount(){
const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

if(!email){
alert("Enter your email.");
return;
}

if(!password||password.length<8){
alert("Choose a password with at least 8 characters.");
return;
}

try{
const r=await fetch(
SUPABASE_URL+"/auth/v1/signup",
{
method:"POST",
headers:{
apikey:SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({email,password})
}
);

const x=await r.json();

if(!r.ok){
throw new Error(x.msg||x.message||"Could not create account.");
}

if(x.access_token){
x.expires_at=Math.floor(Date.now()/1000)+Number(x.expires_in||3600);
storeSession(x);
await checkAccess();
await loadSharedData(false);
page="dashboard";
render();
return;
}

alert(
"Account created. Check your email for the confirmation message, then come back and sign in."
);

}catch(e){
alert(e.message);
}
}

async function login(){
const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

if(!email||!password){
alert("Enter your email and password.");
return;
}

try{
const r=await fetch(
SUPABASE_URL+"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
apikey:SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({email,password})
}
);

const x=await r.json();

if(!r.ok){
throw new Error(
x.error_description||
x.msg||
x.message||
"Login failed."
);
}

x.expires_at=Math.floor(Date.now()/1000)+Number(x.expires_in||3600);

storeSession(x);

await checkAccess();
await loadSharedData(false);

page="dashboard";
render();

}catch(e){
alert(e.message);
}
}

async function logout(){
try{
if(session&&session.access_token){
await fetch(
SUPABASE_URL+"/auth/v1/logout",
{
method:"POST",
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+session.access_token
}
}
);
}
}catch{}

storeSession(null);
authUser=null;
access={role:"viewer",team:null,email:""};
editingPlayerId=null;
data.users=[];
page="dashboard";

await loadSharedData(false);
render();
}

/* ==========================================================
   RENDER
   ========================================================== */

function render(){
drawNav();
drawConnectionStatus();

let html="";

if(page==="dashboard")html=dashboard();
else if(page==="live")html=liveBoardPage();
else if(page==="players")html=playersPage();
else if(page==="matchups")html=matchupPage();
else if(page==="scoring")html=scoringPage();
else if(page==="skins")html=skinsPage();
else if(page==="users")html=usersPage();
else html=loginPage();

document.getElementById("app").innerHTML=html;
}

/*
Refresh shared data every 10 seconds,
but never interrupt someone actively entering a score
or changing a selection.
*/
setInterval(async()=>{
const a=document.activeElement;

const editing=
a&&(
a.tagName==="INPUT"||
a.tagName==="SELECT"
);

if(!editing){
await loadSharedData(true);
}
},10000);

async function start(){
loadStoredSession();

await refreshSessionIfNeeded();
await checkAccess();
await loadSharedData(false);

render();
}

start();
</script>
