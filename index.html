.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");
}

/* ==========================================================
   AUTH
   ========================================================== */

function loadStoredSession(){
try{
session=JSON.parse(
localStorage.getItem(SESSION_KEY)||"null"
);
}catch{
session=null;
}
}

function storeSession(newSession){
session=newSession;

if(newSession){
localStorage.setItem(
SESSION_KEY,
JSON.stringify(newSession)
);
}else{
localStorage.removeItem(SESSION_KEY);
}
}

function authToken(){
return session&&session.access_token
?session.access_token
:SUPABASE_KEY;
}

async function refreshSessionIfNeeded(){

if(!session||!session.refresh_token)return;

const expiresAt=Number(session.expires_at||0);
const now=Math.floor(Date.now()/1000);

if(expiresAt&&expiresAt-now>120)return;

try{

const r=await fetch(
SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",
{
method:"POST",
headers:{
apikey:SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
refresh_token:session.refresh_token
})
}
);

if(!r.ok){
throw new Error("Refresh failed");
}

const x=await r.json();

x.expires_at=
Math.floor(Date.now()/1000)+
Number(x.expires_in||3600);

storeSession(x);

}catch(e){

storeSession(null);
currentUser=null;
userRole="viewer";
userTeam=null;

}
}

async function loadCurrentUser(){

currentUser=null;

if(!session||!session.access_token)return;

try{

const r=await fetch(
SUPABASE_URL+"/auth/v1/user",
{
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+session.access_token
}
}
);

if(!r.ok)return;

currentUser=await r.json();

}catch(e){
console.error(e);
}
}

if(!isSignedIn())return;

SUPABASE_URL+"/rest/v1/rpc/register_duffers_user",

async function loadMyPermissions(){

userRole="viewer";
userTeam=null;

await registerCurrentUser();

try{

SUPABASE_URL+
"/rest/v1/tournament_users"+

"&select=*";

const r=await fetch(

if(r.ok){

const rows=await r.json();

if(rows.length){

}

}catch(e){
console.error(e);

if(
String(currentUser.email||"").toLowerCase()===

userRole="owner";
userTeam=null;
}
}

/* ==========================================================
   DATABASE
   ========================================================== */

function headers(extra={}){
return{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+authToken(),
"Content-Type":"application/json",
...extra
};
}

async function apiGet(table){

await refreshSessionIfNeeded();

const url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?tournament_id=eq."+
encodeURIComponent(TOURNAMENT_ID)+
"&select=*";

const r=await fetch(
url,
{headers:headers()}
);

if(!r.ok){
throw new Error(
"Database read failed: "+table
);
}

return await r.json();
}

async function upsert(table,row,conflict){

await refreshSessionIfNeeded();

const url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?on_conflict="+
encodeURIComponent(conflict);

const r=await fetch(
url,
{
method:"POST",
headers:headers({
Prefer:"resolution=merge-duplicates,return=minimal"
}),
body:JSON.stringify(row)
}
);

if(!r.ok){

console.error(await r.text());

throw new Error(
"Database save failed"
);

}
}

async function deleteRows(table,filters){

await refreshSessionIfNeeded();

let url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?tournament_id=eq."+
encodeURIComponent(TOURNAMENT_ID);

Object.entries(filters).forEach(
([k,v])=>{
url+="&"+k+"=eq."+encodeURIComponent(v);
}
);

const r=await fetch(
url,
{
method:"DELETE",
headers:headers()
}
);

if(!r.ok){

console.error(await r.text());

throw new Error(
"Database delete failed"
);

}
}

async function loadSharedData(rerender=true){

try{

const [
players,
matchups,
scores,
results
]=await Promise.all([
apiGet("tournament_players"),
apiGet("tournament_matchups"),
apiGet("tournament_scores"),
apiGet("tournament_results")
]);

data.players=players.map(r=>({
id:r.id,
name:r.name,
handicap:r.handicap,
team:r.team,
group:r.group_name
}));

data.matchups={};

matchups.forEach(r=>{

if(!data.matchups[r.round_no]){
data.matchups[r.round_no]=[];
}

data.matchups[r.round_no][r.match_no-1]={
id:"R"+r.round_no+"M"+r.match_no,
matchNo:r.match_no,
hackers:r.hackers||[],
shankers:r.shankers||[]
};

});

data.scores={};

scores.forEach(r=>{

const id=
"R"+
r.round_no+
"M"+
r.match_no;

if(!data.scores[id]){

data.scores[id]={
holes:Array.from(
{length:18},
()=>({})
)
};

}

data.scores[id]
.holes[r.hole-1]
[r.scorer_key]=r.score;

});

data.results={};

results.forEach(r=>{

data.results[
"R"+
r.round_no+
"M"+
r.match_no
]={
winner:r.winner
};

});

connected=true;

drawConnectionStatus();

if(rerender){
render();
}

}catch(e){

console.error(e);

connected=false;

drawConnectionStatus();

}
}

/* ==========================================================

function teamPoints(){

let hackers=0;
let shankers=0;
let completed=0;

Object.values(data.results).forEach(r=>{

if(!r)return;

if(r.winner==="Hackers"){

hackers++;
completed++;

}else if(r.winner==="Shankers"){

shankers++;
completed++;

}else if(r.winner==="Halved"){

hackers+=.5;
shankers+=.5;
completed++;

}

});

return{
hackers,
shankers,
completed
};
}

return names.join("<br>");

function validateRound(){

if(!isOwner())return;

const r=roundInfo();
const m=setupMatches();
const used=new Set();

for(
let i=0;
i<m.length;
i++
){

const match=m[i];

const required=
r.type==="singles"
?1
:2;

if(
match.hackers.filter(Boolean).length!==required||
match.shankers.filter(Boolean).length!==required
){

alert(
"Match "+
(i+1)+
" is incomplete."
);

return;
}

for(
const id of
[
...match.hackers,
...match.shankers
]
){

if(
used.has(String(id))
){

alert(
"A player is used more than once in this round."
);

return;
}

used.add(String(id));

}
}

if(used.size!==32){

alert(
"All 32 players must appear exactly once."
);

return;
}

alert(
"Round "+
currentRound+
" matchups are ready!"
);
}

/*
NEW FAST SCORE ENTRY:

1. enterkeyhint="next" encourages the iPhone Next/check button.
2. focus selects the existing score.
3. Enter advances to the next hole.
4. Hole 18 advances to Hole 1 of the next golfer.
5. The scorecard scrolls horizontally to keep the next box visible.
*/

function selectScoreInput(el){

if(!el||el.disabled)return;

setTimeout(()=>{

try{
el.select();
}catch(e){}

},0);
}

function handleScoreKeydown(
event,
el
){

if(event.key!=="Enter")return;

event.preventDefault();

advanceScoreInput(el);
}

function advanceScoreInput(el){

if(!el)return;

const table=
el.closest(".scoretable");

if(!table)return;

const inputs=
Array.from(
table.querySelectorAll(
"input.scoreInput:not(:disabled)"
)
);

const currentIndex=
inputs.indexOf(el);

if(currentIndex<0)return;

const next=
inputs[currentIndex+1];

if(!next){

el.blur();
return;

}

next.focus({
preventScroll:true
});

try{
next.select();
}catch(e){}

const wrapper=
next.closest(".tablewrap");

const cell=
next.closest("td");

if(wrapper&&cell){

const wrapperRect=
wrapper.getBoundingClientRect();

const cellRect=
cell.getBoundingClientRect();

const stickyWidth=155;

const leftLimit=
wrapperRect.left+
stickyWidth+
8;

const rightLimit=
wrapperRect.right-
8;

if(
cellRect.left<leftLimit||
cellRect.right>rightLimit
){

const desiredLeft=
wrapper.scrollLeft+
(cellRect.left-wrapperRect.left)-
(wrapper.clientWidth/2)+
(cellRect.width/2);

wrapper.scrollTo({
left:Math.max(0,desiredLeft),
behavior:"smooth"
});

}

}
}

function queueScore(
round,
matchNo,
matchId,
holeIndex,
scorer,
value
){

if(!canScore())return;

const score=
getScore(matchId);

score.holes[holeIndex][scorer]=
value===""
?""
:Number(value);

updateScoreTotals(
matchId,
scorer
);

const key=
round+
"-"+
matchNo+
"-"+
holeIndex+
"-"+
scorer;

clearTimeout(
saveTimers[key]
);

saveTimers[key]=
setTimeout(
()=>
saveScoreOnline(
round,
matchNo,
holeIndex+1,
scorer,
value
),
350
);
}

/* ==========================================================
   SCATS
   ========================================================== */

function getScatResults(
roundId,
group
){

const r=
ROUNDS.find(
x=>x.id===roundId
);

if(!r||!r.scats){
return[];
}

const matches=
data.matchups[roundId]||[];

const results=[];

for(
let h=0;
h<18;
h++
){

const entered=[];

matches.forEach(match=>{

if(!match)return;

const sd=
data.scores[match.id];

if(!sd)return;

const s=
sd.holes[h]||{};

[
...(match.hackers||[]),
...(match.shankers||[])
].forEach(id=>{

const p=
getPlayer(id);

if(
!p||
p.group!==group
)return;

const v=
Number(s[p.id]);

if(v>0){

entered.push({
id:p.id,
name:p.name,
score:v
});

}

});

});

if(!entered.length){

results.push({
hole:h+1,
status:"none"
});

continue;
}

const low=
Math.min(
...entered.map(
x=>x.score
)
);

const winners=
entered.filter(
x=>x.score===low
);

results.push(
winners.length===1
?{
hole:h+1,
status:"scat",
winner:winners[0],
score:low,
entered:entered.length
}
:{
hole:h+1,
status:"tie",
score:low,
winners,
entered:entered.length
}
);

}

return results;
}

function scatSummary(
roundId,
group
){

const counts={};

getScatResults(
roundId,
group
).forEach(r=>{

if(r.status!=="scat")return;

const id=
String(r.winner.id);

if(!counts[id]){

counts[id]={
name:r.winner.name,
count:0
};

}

counts[id].count++;

});

return Object.values(counts)
.sort(
(a,b)=>b.count-a.count
);
}

function scatGroupCard(
round,
group
){

const results=
getScatResults(
round.id,
group
);

const summary=
scatSummary(
round.id,
group
);

const won=
results.filter(
r=>r.status==="scat"
).length;

return`

<div class="card">

<h2>
Group ${group}
</h2>

<div class="scatCount">
${won} scats won
</div>

${summary.length
?`

<h3>
Scat Leaders
</h3>

${summary.map(x=>`

<span class="pill">

<b>
${escapeHtml(x.name)}
</b>

—

${x.count}
${x.count===1?"scat":"scats"}

</span>

`).join("")}

`
:""}

<h3>
Hole-by-Hole
</h3>

${results.map(r=>

r.status==="scat"

?`

<div class="scatWinner">

<b>
Hole ${r.hole} — SCAT
</b>

<br>

${escapeHtml(r.winner.name)}
— ${r.score}

<br>

<span class="muted">
${r.entered}
entered score${r.entered===1?"":"s"}
</span>

</div>

`

:r.status==="tie"

?`

<div class="scatTie">

<b>
Hole ${r.hole} — NO SCAT
</b>

<br>

Tie at ${r.score}

<br>

${r.winners
.map(p=>escapeHtml(p.name))
.join(", ")}

</div>

`

:`

<div class="scatNone">

<b>
Hole ${r.hole}
</b>

— No scores entered

</div>

`

).join("")}

</div>

`;
}

async function saveUserAccess(
userId
){

if(!isOwner())return;

const box=
document.getElementById(
"access-"+userId
);

if(!box)return;

const choice=
box.value;

let role="viewer";
let team=null;

if(choice==="scorer"){

role="scorer";

}else if(
choice==="captain_hackers"
){

role="captain";
team="Hackers";

}else if(
choice==="captain_shankers"
){

role="captain";
team="Shankers";

}

try{

await refreshSessionIfNeeded();

const url=
SUPABASE_URL+
"/rest/v1/tournament_users"+
"?tournament_id=eq."+
encodeURIComponent(TOURNAMENT_ID)+
"&user_id=eq."+
encodeURIComponent(userId);

const r=await fetch(
url,
{
method:"PATCH",
headers:headers({
Prefer:"return=minimal"
}),
body:JSON.stringify({
role,
team,
updated_at:new Date().toISOString()
})
}
);

if(!r.ok){

console.error(
await r.text()
);

throw new Error(
"Permission save failed"
);

}

await loadTournamentUsers();

render();

}catch(e){

console.error(e);

alert(
"User permissions could not be saved."
);

}
}

async function accountLogin(){

const email=
document
.getElementById("loginEmail")
.value
.trim();

const password=
document
.getElementById("loginPassword")
.value;

if(!email||!password){

alert(
"Enter your email and password."
);

return;
}

try{

const r=await fetch(
SUPABASE_URL+
"/auth/v1/token?grant_type=password",
{
method:"POST",
headers:{
apikey:SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email,
password
})
}
);

const x=await r.json();

if(!r.ok){

throw new Error(
x.error_description||
x.msg||
x.message||
"Login failed."
);

}

x.expires_at=
Math.floor(Date.now()/1000)+
Number(x.expires_in||3600);

storeSession(x);

await loadCurrentUser();

await loadMyPermissions();

await loadSharedData(false);

if(isOwner()){

await loadTournamentUsers();

}

page="dashboard";

render();

}catch(e){

alert(e.message);

}
}

async function createAccount(){

const email=
document
.getElementById("loginEmail")
.value
.trim();

const password=
document
.getElementById("loginPassword")
.value;

if(!email){

alert(
"Enter your email."
);

return;
}

if(
!password||
password.length<8
){

alert(
"Choose a password with at least 8 characters."
);

return;
}

try{

const r=await fetch(
SUPABASE_URL+
"/auth/v1/signup",
{
method:"POST",
headers:{
apikey:SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email,
password
})
}
);

const x=await r.json();

if(!r.ok){

throw new Error(
x.msg||
x.message||
"Could not create account."
);

}

if(x.access_token){

x.expires_at=
Math.floor(Date.now()/1000)+
Number(x.expires_in||3600);

storeSession(x);

await loadCurrentUser();

await loadMyPermissions();

await loadSharedData(false);

page="dashboard";

render();

return;
}

alert(
"Account created. Check your email for the confirmation message, then come back and sign in."
);

}catch(e){

alert(e.message);

}
}

session.access_token

{

headers:{
apikey:SUPABASE_KEY,

}

);

currentUser=null;

}else if(page==="players"){

}else if(page==="matchups"){

}else if(page==="users"){

}else{

html=loginPage();

}

document
.getElementById("app")
.innerHTML=html;
}

/*
Auto refresh shared tournament data every 10 seconds.
Do not refresh while somebody is actively entering
a score or using a dropdown.
*/
setInterval(
async()=>{

const a=
document.activeElement;

const editing=
a&&(
a.tagName==="INPUT"||
a.tagName==="SELECT"
);

if(!editing){

await loadSharedData(false);

if(
page==="users"&&
isOwner()
){

await loadTournamentUsers();

}

render();

}

},
10000
);

loadStoredSession();

if(isSignedIn()){

await loadMyPermissions();

}

await loadSharedData(false);

if(isOwner()){

await loadTournamentUsers();

}

render();
}

start();
