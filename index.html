function loadStoredSession(){
try{
session=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");
}catch{
session=null;
}
}

function storeSession(newSession){
session=newSession;
if(session){
localStorage.setItem(SESSION_KEY,JSON.stringify(session));
}else{
localStorage.removeItem(SESSION_KEY);
}
}

function authToken(){
return session&&session.access_token?session.access_token:SUPABASE_KEY;
}

async function refreshSessionIfNeeded(){
if(!session||!session.refresh_token)return;

const expiresAt=Number(session.expires_at||0);
const now=Math.floor(Date.now()/1000);

if(expiresAt&&expiresAt-now>120)return;

try{
const r=await fetch(
SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",
{
method:"POST",
headers:{
apikey:SUPABASE_KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
refresh_token:session.refresh_token
})
}
);

if(!r.ok)throw new Error("Refresh failed");

const x=await r.json();

x.expires_at=
Math.floor(Date.now()/1000)+
Number(x.expires_in||3600);

storeSession(x);
await checkAdmin();

}catch{
storeSession(null);
isAdmin=false;
}
}

async function checkAdmin(){

if(!session||!session.access_token){
isAdmin=false;
return;
}

try{

const r=await fetch(
SUPABASE_URL+"/auth/v1/user",
{
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+session.access_token
}
}
);

if(!r.ok){
isAdmin=false;
return;
}

const u=await r.json();

isAdmin=
String(u.email||"").toLowerCase()===
ADMIN_EMAIL;

}catch{
isAdmin=false;
}

}

document.getElementById("adminPassword").value;

SUPABASE_URL+"/auth/v1/signup",
{

"Content-Type":"application/json"
},
body:JSON.stringify({

}
);

const x=await r.json();

if(!r.ok){
throw new Error(
x.msg||
x.message||
"Could not create account."
);
}

if(x.access_token){

x.expires_at=
Math.floor(Date.now()/1000)+
Number(x.expires_in||3600);

storeSession(x);

await checkAdmin();

async function adminLogin(){

const password=
document.getElementById("adminPassword").value;

if(!password){
alert("Enter your password.");
return;
}

try{

const r=await fetch(
SUPABASE_URL+
"/auth/v1/token?grant_type=password",
{

"Content-Type":"application/json"
},

email:ADMIN_EMAIL,
password
})
}
);

const x=await r.json();

if(!r.ok){
throw new Error(
x.error_description||
x.msg||
x.message||
"Login failed."
);
}

x.expires_at=
Math.floor(Date.now()/1000)+
Number(x.expires_in||3600);

storeSession(x);

await checkAdmin();

if(!isAdmin){
storeSession(null);
throw new Error(
"This account is not authorized as administrator."
);

page="dashboard";

await loadSharedData(false);

}catch(e){

}

function headers(extra={}){
return{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+authToken(),
"Content-Type":"application/json",
...extra
};
}

async function apiGet(table){

await refreshSessionIfNeeded();

const url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?tournament_id=eq."+
encodeURIComponent(TOURNAMENT_ID)+
"&select=*";

const r=await fetch(url,{
headers:headers()
});

if(!r.ok){
throw new Error("Database read failed");
}

return await r.json();

}

async function upsert(table,row,conflict){

if(!isAdmin){
throw new Error("Admin login required.");
}

await refreshSessionIfNeeded();

const url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?on_conflict="+
encodeURIComponent(conflict);

const r=await fetch(
url,
{
method:"POST",
headers:headers({
Prefer:
"resolution=merge-duplicates,return=minimal"
}),
body:JSON.stringify(row)
}
);

if(!r.ok){

console.error(await r.text());

throw new Error(
"Database save failed"
);

}

}

async function deleteRows(table,filters){

if(!isAdmin){
throw new Error(
"Admin login required."
);
}

await refreshSessionIfNeeded();

let url=
SUPABASE_URL+
"/rest/v1/"+
table+
"?tournament_id=eq."+
encodeURIComponent(TOURNAMENT_ID);

Object.entries(filters).forEach(
([k,v])=>{
url+="&"+
k+
"=eq."+
encodeURIComponent(v);
}
);

const r=await fetch(
url,
{
method:"DELETE",
headers:headers()
}
);

if(!r.ok){
throw new Error(
"Database delete failed"
);
}

}

async function loadSharedData(rerender=true){

try{

const [
players,
matchups,
scores,
results
]=await Promise.all([
apiGet("tournament_players"),
apiGet("tournament_matchups"),
apiGet("tournament_scores"),
apiGet("tournament_results")
]);

data.players=
players.map(r=>({
id:r.id,
name:r.name,
handicap:r.handicap,
team:r.team,
group:r.group_name
}));

data.matchups={};

matchups.forEach(r=>{

if(!data.matchups[r.round_no]){
data.matchups[r.round_no]=[];
}

data.matchups[r.round_no][r.match_no-1]={
id:"R"+r.round_no+"M"+r.match_no,
matchNo:r.match_no,
hackers:r.hackers||[],
shankers:r.shankers||[]
};

});

data.scores={};

scores.forEach(r=>{

const id=
"R"+r.round_no+"M"+r.match_no;

if(!data.scores[id]){

data.scores[id]={
holes:Array.from(
{length:18},
()=>({})
)
};

}

data.scores[id]
.holes[r.hole-1]
[r.scorer_key]=r.score;

});

data.results={};

results.forEach(r=>{

data.results[
"R"+r.round_no+"M"+r.match_no
]={
winner:r.winner
};

});

connected=true;

drawConnectionStatus();

if(rerender){
render();
}

}catch(e){

console.error(e);

connected=false;

drawConnectionStatus();

}

}

</div>`

`<div class="viewer">
👀 VIEWER MODE — Read only
</div>`
);

}

function teamPoints(){

let hackers=0;
let shankers=0;
let completed=0;

Object.values(data.results).forEach(r=>{

if(!r)return;

if(r.winner==="Hackers"){
hackers++;
completed++;
}

else if(r.winner==="Shankers"){
shankers++;
completed++;
}

else if(r.winner==="Halved"){
hackers+=.5;
shankers+=.5;
completed++;
}

});

return{
hackers,
shankers,
completed
};

}

function validateRound(){

if(!isAdmin)return;

const r=roundInfo();
const m=setupMatches();
const used=new Set();

for(let i=0;i<m.length;i++){

const match=m[i];

const required=
r.type==="singles"?1:2;

if(
match.hackers.filter(Boolean).length!==required||
match.shankers.filter(Boolean).length!==required
){

alert(
"Match "+(i+1)+" is incomplete."
);

return;

}

for(
const id of [
...match.hackers,
...match.shankers
]
){

if(used.has(String(id))){

alert(
"A player is used more than once in this round."
);

return;

}

used.add(String(id));

}

}

if(used.size!==32){

alert(
"All 32 players must appear exactly once."
);

return;

}

alert(
"Round "+
currentRound+
" matchups are ready!"
);

}

function enteredNine(score,id,start){

let total=0;

for(
let h=start;
h<start+9;
h++
){

const v=
Number(
(score.holes[h]||{})[id]
);

if(!(v>0)){
return "—";
}

total+=v;

}

return total;

}

function enteredTotal(score,id){

const out=
enteredNine(score,id,0);

const inn=
enteredNine(score,id,9);

if(
out==="—"||
inn==="—"
){
return "—";
}

return out+inn;

}

function nineTotal(values,start){

return values
.slice(start,start+9)
.reduce(
(a,b)=>a+Number(b||0),
0
);

}

[
...(match.hackers||[]),
...(match.shankers||[])
].forEach(id=>{

const p=getPlayer(id);

if(!p||p.group!==group){
return;
}

const v=
Number(s[p.id]);

if(v>0){

entered.push({
id:p.id,
name:p.name,
score:v
});

}

});

});

if(!entered.length){

results.push({
hole:h+1,
status:"none"
});

continue;

}

const low=
Math.min(
...entered.map(
x=>x.score
)
);

const winners=
entered.filter(
x=>x.score===low
);

results.push(
winners.length===1
?
{
hole:h+1,
status:"skin",
winner:winners[0],
score:low,
entered:entered.length
}
:
{
hole:h+1,
status:"tie",
score:low,
winners,
entered:entered.length
}
);

}

return results;

}

function skinSummary(
roundId,
group
){

const counts={};

getSkinResults(
roundId,
group
).forEach(r=>{

if(r.status!=="skin"){
return;
}

const id=
String(r.winner.id);

if(!counts[id]){

counts[id]={
name:r.winner.name,
count:0
};

}

counts[id].count++;

});

return Object
.values(counts)
.sort(
(a,b)=>b.count-a.count
);

}

function skinGroupCard(
round,
group
){

const results=
getSkinResults(
round.id,
group
);

const summary=
skinSummary(
round.id,
group
);

const won=
results.filter(
r=>r.status==="skin"
).length;

return`
<div class="card">

<h2>
Group ${group}
</h2>

<div class="skinCount">
${won} skins won
</div>

${summary.length
?
`
<h3>
Skin Leaders
</h3>

${summary.map(x=>`

<span class="pill">

<b>
${x.name}
</b>

—
${x.count}

${x.count===1
?
"skin"
:
"skins"
}

</span>

`).join("")}
`
:
""
}

<h3>
Hole-by-Hole
</h3>

${results.map(r=>

r.status==="skin"

?

`
<div class="skinWinner">

<b>
Hole ${r.hole} — SKIN
</b>

<br>

${r.winner.name}
—
${r.score}

<br>

<span class="muted">
${r.entered}
entered score${r.entered===1?"":"s"}
</span>

</div>
`

:

r.status==="tie"

?

`
<div class="skinTie">

<b>
Hole ${r.hole} — NO SKIN
</b>

<br>

Tie at ${r.score}

<br>

${r.winners
.map(p=>p.name)
.join(", ")}

</div>
`

:

`
<div class="skinNone">

<b>
Hole ${r.hole}
</b>

— No scores entered

</div>
`

).join("")}

</div>
`;

}

function skinsPage(){

const rounds=
ROUNDS.filter(
r=>r.skins
);

return`
<div class="card">

<h2>
Skins
</h2>

<div class="muted">
Gross scores • lowest unique score wins • ties = no skin • no carryovers
</div>

</div>

${rounds.map(r=>`

<div class="card">

<h2>
Round ${r.id} — ${r.course}
</h2>

<div class="muted">
${r.format}
</div>

</div>

${skinGroupCard(r,"A")}

${skinGroupCard(r,"B")}

`).join("")}
`;

}

document.getElementById("app").innerHTML=

scoringPage()
