/* =====================================
   SESSION
===================================== */

function loadStoredSession(){

try{

session=
JSON.parse(
localStorage.getItem(SESSION_KEY)
||
"null"
);

}catch{

session=null;

}

}


function storeSession(newSession){

session=newSession;

if(session){

localStorage.setItem(
SESSION_KEY,
JSON.stringify(session)
);

}else{

localStorage.removeItem(
SESSION_KEY
);

}

}


function authToken(){

return session &&
session.access_token
?
session.access_token
:
SUPABASE_KEY;

}


async function refreshSessionIfNeeded(){

if(
!session ||
!session.refresh_token
){

return;

}


const expiresAt=
Number(
session.expires_at || 0
);


const now=
Math.floor(
Date.now()/1000
);


if(
expiresAt &&
expiresAt-now>120
){

return;

}


try{

const response=
await fetch(

SUPABASE_URL+
"/auth/v1/token?grant_type=refresh_token",

{

method:"POST",

headers:{

apikey:
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

refresh_token:
session.refresh_token

})

}

);


if(!response.ok){

throw new Error(
"Refresh failed"
);

}


const result=
await response.json();


result.expires_at=

Math.floor(
Date.now()/1000
)
+
Number(
result.expires_in || 3600
);


storeSession(
result
);


await checkAdmin();

}

catch{

storeSession(
null
);

isAdmin=false;

}

}


async function checkAdmin(){

if(
!session ||
!session.access_token
){

isAdmin=false;

return;

}


try{

const response=
await fetch(

SUPABASE_URL+
"/auth/v1/user",

{

headers:{

apikey:
SUPABASE_KEY,

Authorization:
"Bearer "+
session.access_token

}

}

);


if(!response.ok){

isAdmin=false;

return;

}


const user=
await response.json();


isAdmin=

String(
user.email || ""
)
.toLowerCase()
===
ADMIN_EMAIL;

}

catch{

isAdmin=false;

}

}

/* =====================================
   API
===================================== */

function headers(extra={}){

return{

apikey:
SUPABASE_KEY,

Authorization:
"Bearer "+
authToken(),

"Content-Type":
"application/json",

...extra

};

}


async function apiGet(table){

await refreshSessionIfNeeded();


const url=

SUPABASE_URL+
"/rest/v1/"+
table+
"?tournament_id=eq."+
encodeURIComponent(
TOURNAMENT_ID
)
+
"&select=*";


const response=
await fetch(

url,

{
headers:
headers()
}

);


if(!response.ok){

throw new Error(
"Database read failed"
);

}


return await response.json();

}


async function upsert(
table,
row,
conflict
){

if(!isAdmin){

throw new Error(
"Admin login required."
);

}


await refreshSessionIfNeeded();


const url=

SUPABASE_URL+
"/rest/v1/"+
table+
"?on_conflict="+
encodeURIComponent(
conflict
);


const response=
await fetch(

url,

{

method:"POST",

headers:
headers({

Prefer:
"resolution=merge-duplicates,return=minimal"

}),

body:
JSON.stringify(
row
)

}

);


if(!response.ok){

const message=
await response.text();

console.error(
message
);

throw new Error(
"Database save failed"
);

}

}


async function deleteRows(
table,
filters
){

if(!isAdmin){

throw new Error(
"Admin login required."
);

}


await refreshSessionIfNeeded();


let url=

SUPABASE_URL+
"/rest/v1/"+
table+
"?tournament_id=eq."+
encodeURIComponent(
TOURNAMENT_ID
);


Object.entries(
filters
)
.forEach(
([key,value])=>{

url+=
"&"+
key+
"=eq."+
encodeURIComponent(
value
);

}
);


const response=
await fetch(

url,

{

method:"DELETE",

headers:
headers()

}

);


if(!response.ok){

throw new Error(
"Database delete failed"
);

}

}


/* =====================================
   LOAD DATA
===================================== */

async function loadSharedData(
rerender=true
){

try{

const [
players,
matchups,
scores,
results
]=

await Promise.all([

apiGet(
"tournament_players"
),

apiGet(
"tournament_matchups"
),

apiGet(
"tournament_scores"
),

apiGet(
"tournament_results"
)

]);


data.players=

players.map(
row=>({

id:
row.id,

name:
row.name,

handicap:
row.handicap,

team:
row.team,

group:
row.group_name

})
);


data.matchups={};


matchups.forEach(
row=>{

if(
!data.matchups[
row.round_no
]
){

data.matchups[
row.round_no
]=[];

}


data.matchups[
row.round_no
][
row.match_no-1
]
={

id:
"R"+
row.round_no+
"M"+
row.match_no,

matchNo:
row.match_no,

hackers:
row.hackers || [],

shankers:
row.shankers || []

};

}
);


data.scores={};


scores.forEach(
row=>{

const matchId=

"R"+
row.round_no+
"M"+
row.match_no;


if(
!data.scores[
matchId
]
){

data.scores[
matchId
]={

holes:
Array.from(
{length:18},
()=>({})
)

};

}


data.scores[
matchId
]
.holes[
row.hole-1
][
row.scorer_key
]
=
row.score;

}
);


data.results={};


results.forEach(
row=>{

const matchId=

"R"+
row.round_no+
"M"+
row.match_no;


data.results[
matchId
]={

winner:
row.winner

};

}
);


connected=true;


drawConnectionStatus();


if(rerender){

render();

}

}

catch(error){

console.error(
error
);

connected=false;

drawConnectionStatus();

}

}

/* =====================================
   POINTS
===================================== */

function teamPoints(){

let hackers=0;

let shankers=0;

let completed=0;


Object.values(
data.results
)
.forEach(
result=>{

if(!result){
return;
}


if(
result.winner===
"Hackers"
){

hackers+=1;

completed+=1;

}


else if(
result.winner===
"Shankers"
){

shankers+=1;

completed+=1;

}


else if(
result.winner===
"Halved"
){

hackers+=0.5;

shankers+=0.5;

completed+=1;

}

}
);


return{

hackers,

shankers,

completed

};

}

async function savePlayerEdit(){

if(
!isAdmin ||
!editingPlayerId
){

return;

}


const player=
getPlayer(
editingPlayerId
);


if(!player){
return;
}


const name=
document
.getElementById(
"editName"
)
.value
.trim();


const handicap=
document
.getElementById(
"editHcp"
)
.value
||
0;


const team=
document
.getElementById(
"editTeam"
)
.value;


const group=
document
.getElementById(
"editGroup"
)
.value;


if(!name){

alert(
"Enter a player name."
);

return;

}


if(
team!==player.team
){

const teamCount=

data.players.filter(
p=>
p.team===team &&
String(p.id)!==
String(player.id)
).length;


if(teamCount>=16){

alert(
team+
" already has 16 players."
);

return;

}

}


if(
group!==player.group
){

const groupCount=

data.players.filter(
p=>
p.group===group &&
String(p.id)!==
String(player.id)
).length;


if(groupCount>=16){

alert(
"Group "+
group+
" already has 16 players."
);

return;

}

}


try{

await upsert(

"tournament_players",

{

tournament_id:
TOURNAMENT_ID,

id:
player.id,

name:
name,

handicap:
String(handicap),

team:
team,

group_name:
group

},

"tournament_id,id"

);


player.name=
name;

player.handicap=
String(handicap);

player.team=
team;

player.group=
group;


editingPlayerId=
null;


render();

}

catch(error){

alert(
"Player changes could not be saved."
);

}

}

)
){

function setupMatches(){

const round=
roundInfo();


if(
!data.matchups[
currentRound
]
){

data.matchups[
currentRound
]=[];

}


while(

data.matchups[
currentRound
]
.length
<
round.matches

){

const index=

data.matchups[
currentRound
]
.length;


data.matchups[
currentRound
][
index
]
={

id:
"R"+
currentRound+
"M"+
(index+1),

matchNo:
index+1,

hackers:[],

shankers:[]

};

}


return data.matchups[
currentRound
];

}

playerId
){

const match=

data.matchups[
currentRound
][

side
][
slot
]
=

try{

await upsert(

"tournament_matchups",

{

tournament_id:
TOURNAMENT_ID,

round_no:
currentRound,

matchIndex+1,

function validateRound(){

if(!isAdmin){
return;
}


const round=
roundInfo();


const matches=
setupMatches();


const used=
new Set();


for(
let index=0;
index<matches.length;
index++
){

const match=
matches[index];


const required=

round.type==="singles"
?
1
:
2;


if(

match.hackers.filter(
Boolean
).length!==required

||

match.shankers.filter(
Boolean
).length!==required

){

alert(
"Match "+
(index+1)+
" is incomplete."
);

return;

}


for(
const playerId of [

...match.hackers,

...match.shankers

]
){

if(
used.has(
String(playerId)
)
){

alert(
"A player is used more than once in this round."
);

return;

}


used.add(
String(playerId)
);

}

}


if(
used.size!==32
){

alert(
"All 32 players must appear exactly once."
);

return;

}


alert(
"Round "+
currentRound+
" matchups are ready!"
);

}


/* =====================================
   SCORES
===================================== */

function getScore(
matchId
){

if(
!data.scores[
matchId
]
){

data.scores[
matchId
]={

holes:
Array.from(
{length:18},
()=>({})

)

};

}


while(
data.scores[
matchId
]
.holes.length
<
18
){

data.scores[
matchId
]
.holes.push(
{}
);

}


return data.scores[
matchId
];

}


function playerTotal(
score,
playerId
){

let total=0;

let entered=0;


for(
let hole=0;
hole<18;
hole++
){

const value=

Number(
score.holes[
hole
][
playerId
]
);


if(value>0){

total+=value;

entered++;

}

}


return entered===18
?
total
:
"—";

}

/* =====================================
   SAVE SCORES
===================================== */

function queueScore(
round,
matchNo,
matchId,
holeIndex,
scorer,
value
){

if(!isAdmin){
return;
}


const score=
getScore(
matchId
);


score.holes[
holeIndex
][
scorer
]
=

value===""
?
""
:
Number(
value
);


const timerKey=

round+
"-"+
matchNo+
"-"+
holeIndex+
"-"+
scorer;


clearTimeout(
saveTimers[
timerKey
]
);


saveTimers[
timerKey
]=
setTimeout(

()=>{

saveScoreOnline(

round,
matchNo,
holeIndex+1,
scorer,
value

);

},

350

);

}


async function saveScoreDirect(
round,
matchNo,
hole,
scorer,
value
){

await upsert(

"tournament_scores",

{

tournament_id:
TOURNAMENT_ID,

round_no:
round,

match_no:
matchNo,

hole:
hole,

scorer_key:
String(
scorer
),

score:
Number(
value
)

},

"tournament_id,round_no,match_no,hole,scorer_key"

);

}


async function saveScoreOnline(
round,
matchNo,
hole,
scorer,
value
){

if(!isAdmin){
return;
}


try{

if(value===""){

await deleteRows(

"tournament_scores",

{

round_no:
round,

match_no:
matchNo,

hole:
hole,

scorer_key:
scorer

}

);

}else{

await saveScoreDirect(

round,
matchNo,
hole,
scorer,
Number(
value
)

);

}

}

catch(error){

console.error(
error
);

}

}


/* =====================================
   MATCH RESULT
===================================== */

async function saveMatchResult(
round,
matchNo,
matchId
){

if(!isAdmin){

alert(
"Admin login required."
);

return;

}


const box=

document.getElementById(
"result-"+matchId
);


if(!box){

return;

}


const winner=
box.value;


try{


if(winner===""){

await deleteRows(

"tournament_results",

{

round_no:
round,

match_no:
matchNo

}

);


delete data.results[
matchId
];


render();


return;

}


await upsert(

"tournament_results",

{

tournament_id:
TOURNAMENT_ID,

round_no:
round,

match_no:
matchNo,

winner:
winner

},

"tournament_id,round_no,match_no"

);


data.results[
matchId
]={

winner:
winner

};


render();

}

catch(error){

console.error(
error
);

alert(
"Match result could not be saved or reset."
);

}

}


/* =====================================
   SKINS
===================================== */

function getSkinResults(
roundId,
group
){

const round=

ROUNDS.find(
round=>
round.id===roundId
);


if(
!round ||
!round.skins
){

return [];

}


const matches=

data.matchups[
roundId
]
||
[];


const results=[];


for(
let hole=0;
hole<18;
hole++
){

const entered=[];


matches.forEach(
match=>{

if(!match){
return;
}


const scoreData=

data.scores[
match.id
];


if(!scoreData){
return;
}


const scores=

scoreData.holes[
hole
]
||
{};


const playerIds=[

...(match.hackers || []),

...(match.shankers || [])

];


playerIds.forEach(
playerId=>{

const player=
getPlayer(
playerId
);


if(
!player ||
player.group!==group
){

return;

}


const value=

Number(
scores[
player.id
]
);


if(value>0){

entered.push({

id:
player.id,

name:
player.name,

score:
value

});

}

});

}
);


if(
entered.length===0
){

results.push({

hole:
hole+1,

status:
"none"

});

continue;

}


const low=

Math.min(
...entered.map(
entry=>
entry.score
)
);


const winners=

entered.filter(
entry=>
entry.score===low
);


if(
winners.length===1
){

results.push({

hole:
hole+1,

status:
"skin",

winner:
winners[0],

score:
low,

entered:
entered.length

});

}else{

results.push({

hole:
hole+1,

status:
"tie",

score:
low,

winners:
winners,

entered:
entered.length

});

}

}


return results;

}


function skinSummary(
roundId,
group
){

const counts={};


getSkinResults(
roundId,
group
)
.forEach(
result=>{

if(
result.status!=="skin"
){

return;

}


const id=
String(
result.winner.id
);


if(
!counts[
id
]
){

counts[
id
]={

name:
result.winner.name,

count:
0

};

}


counts[
id
].count++;

}
);


return Object.values(
counts
)
.sort(
(a,b)=>
b.count-a.count
);

}


function skinGroupCard(
round,
group
){

const results=

getSkinResults(
round.id,
group
);


const summary=

skinSummary(
round.id,
group
);


const skinsWon=

results.filter(
result=>
result.status==="skin"
).length;


return`

<div class="card">

<h2>
Group ${group}
</h2>

<div class="skinCount">

${skinsWon}
skins won

</div>


${
summary.length
?
`

<h3>
Skin Leaders
</h3>

${summary.map(
item=>`

<span class="pill">

<b>
${item.name}
</b>

—

${item.count}
${item.count===1 ? " skin" : " skins"}

</span>

`
).join("")}

`
:
""
}


<h3>
Hole-by-Hole
</h3>


${results.map(
result=>{

if(
result.status==="skin"
){

return`

<div class="skinWinner">

<b>

Hole ${result.hole}

— SKIN

</b>

<br>

${result.winner.name}

— ${result.score}

<br>

<span class="muted">

${result.entered}
entered score${
result.entered===1
?
""
:
"s"
}

</span>

</div>

`;

}


if(
result.status==="tie"
){

return`

<div class="skinTie">

<b>

Hole ${result.hole}

— NO SKIN

</b>

<br>

Tie at
${result.score}

<br>

${result.winners
.map(
player=>
player.name
)
.join(", ")}

</div>

`;

}


return`

<div class="skinNone">

<b>
Hole ${result.hole}
</b>

— No scores entered

</div>

`;

}
).join("")}

</div>

`;

}


function skinsPage(){

const skinRounds=

ROUNDS.filter(
round=>
round.skins
);


return`

<div class="card">

<h2>
Skins
</h2>

</div>


${skinRounds.map(
round=>`

<div class="card">

<h2>

Round ${round.id}

—

${round.course}

</h2>

<div class="muted">

${round.format}

</div>

</div>


${skinGroupCard(
round,
"A"
)}


${skinGroupCard(
round,
"B"
)}

`
).join("")}

`;

}
